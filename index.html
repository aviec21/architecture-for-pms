window.XDEEP.m4=[
{t:'Virtual machines, containers and Kubernetes',
 table:{head:['Unit','What it is','Start time','Use when'],rows:[
  ['Physical server','A real machine you own or rent','Days','Rare now; special hardware or strict control'],
  ['VM (Virtual Machine)','A full computer simulated on a shared machine','Minutes','Legacy apps, strong isolation'],
  ['Container (Docker)','An app packaged with its libraries, sharing the host operating system','Seconds','Most modern services; same behaviour on laptop and in production'],
  ['Kubernetes (K8s)','A system that runs and heals many containers across machines','n/a','Many services, need auto scaling and self healing. Adds real operating cost.'],
  ['Serverless function (AWS Lambda, Cloud Functions)','Code that runs only when called; you manage no servers','Milliseconds to a second (cold start)','Spiky or small workloads; watch cold starts and per call cost at high volume']]},
 list:['Pod: the smallest unit in Kubernetes, one or more containers that run together.','Deployment: says "run 5 copies of this pod and replace them gradually when I change the version".','Service: a stable address in front of changing pods.','Autoscaler: adds or removes copies based on load.'],
 so:'Kubernetes is powerful and costly to run. For a small team a managed platform (Cloud Run, App Runner, Vercel, Heroku style) often delivers faster. Ask what problem Kubernetes solves that a simpler option cannot.'},
{t:'CI/CD: how code reaches users',
 p:['CI (Continuous Integration) means every change is built and tested automatically. CD (Continuous Delivery or Deployment) means a passing change can be released with little or no manual work.'],
 list:['1. Developer opens a pull request.','2. Automated checks run: build, unit tests, code style, security scan.','3. Another engineer reviews and approves.','4. Merge to main triggers a build of a deployable package (a container image).','5. Deploy to a test environment, run integration and smoke tests.','6. Deploy to production using a release strategy (below).','7. Monitor the health numbers; roll back automatically or manually if they worsen.'],
 table:{head:['Release strategy','How','Risk','Rollback'],rows:[
  ['Big bang','Replace everything at once','High','Slow'],
  ['Rolling','Replace servers a few at a time','Medium','Roll forward or back gradually'],
  ['Blue-green','Run old (blue) and new (green) side by side, switch traffic','Low, costs double capacity briefly','Switch back instantly'],
  ['Canary','Send 1 to 5 percent of traffic to the new version first','Low','Stop the canary'],
  ['Feature flag','Deploy code switched off, enable for chosen users','Lowest','Turn the flag off']]},
 so:'Two numbers show delivery health: how often you deploy and how long a change takes from commit to production. A team that deploys weekly with fear is riskier than one that deploys daily with small changes.'},
{t:'Availability maths: what the nines really mean',
 table:{head:['Availability','Downtime per year','Per month','Typical meaning'],rows:[
  ['99%','3.65 days','7.3 hours','Hobby or internal tool'],
  ['99.9% ("three nines")','8.76 hours','43.8 minutes','Standard business app'],
  ['99.95%','4.38 hours','21.9 minutes','Important customer facing service'],
  ['99.99% ("four nines")','52.6 minutes','4.4 minutes','Payments, core banking channels'],
  ['99.999% ("five nines")','5.26 minutes','26 seconds','Telecom grade; very expensive']]},
 p:['Chained services multiply. If your service and its three dependencies are each 99.9 percent available, the combined best case is 0.999 x 0.999 x 0.999 x 0.999, which is about 99.6 percent. That is already roughly 35 hours of downtime a year.'],
 so:'Each extra nine often costs 5 to 10 times more. Ask what an hour of downtime really costs the business, then buy the nines that are worth it.'},
{t:'SLI, SLO, SLA, error budget, RTO and RPO',
 table:{head:['Term','Full form','Meaning','Example'],rows:[
  ['SLI','Service Level Indicator','A measured number','Percentage of payment requests answered successfully in under 2 seconds'],
  ['SLO','Service Level Objective','The internal target for the SLI','99.9 percent of requests succeed over 30 days'],
  ['SLA','Service Level Agreement','A contract with penalties if missed','Customer gets credits if monthly uptime is below 99.5 percent'],
  ['Error budget','Allowed unreliability = 100 percent minus the SLO','Spend it on risky releases; when it is gone, slow down and fix reliability','99.9 percent SLO gives about 43 minutes of failure per month'],
  ['RTO','Recovery Time Objective','How long you can be down after a disaster','Back within 30 minutes'],
  ['RPO','Recovery Point Objective','How much data you can afford to lose','At most 5 minutes of data']]},
 so:'Write the SLO before launch with engineering and agree what happens when the error budget runs out. The Google SRE book chapter on SLOs (in Go deeper) explains the method.'},
{t:'Load balancer, regions, availability zones and disaster recovery',
 table:{head:['Term','Meaning','Why it matters'],rows:[
  ['Load balancer','Spreads requests across servers and removes unhealthy ones','Removes single points of failure at the front'],
  ['Availability Zone (AZ)','One or more separate data centres in a city','Running in 2 or 3 AZs survives one data centre failing'],
  ['Region','A geographic area with several AZs (for example Mumbai, Hyderabad)','Choose by user latency, price, and data location laws'],
  ['Multi-AZ','Copies run in several zones of one region','Standard for production'],
  ['Multi-region','Copies run in several regions','Survives a whole region outage; costly and hard for databases'],
  ['Disaster recovery tiers','Backup and restore, pilot light, warm standby, active-active','Cost rises with speed of recovery. Pick by RTO and RPO.']]},
 so:'Regulation matters: RBI rules require payment system data to be stored in India. Region choice is therefore a compliance decision, not only a speed decision.'},
{t:'Observability: logs, metrics and traces',
 table:{head:['Pillar','What','Answers','Example tools'],rows:[
  ['Logs','Text records of events','What exactly happened to this request?','ELK, Splunk, CloudWatch Logs'],
  ['Metrics','Numbers over time','Is something wrong right now? How bad?','Prometheus, Grafana, Datadog'],
  ['Traces','The path of one request across services with timings','Which hop is slow?','OpenTelemetry, Jaeger']]},
 list:['The four golden signals: latency, traffic, errors, saturation (how full the system is).','Alert on symptoms users feel (error rate, slow checkout), not on every internal wobble. Too many alerts cause alert fatigue and real alarms get ignored.','Runbook: a written guide for what to do when an alert fires.'],
 so:'A launch is not ready until a dashboard, alerts, and an on-call owner exist. Put "we can see it, we get paged, we know the first step" in the definition of done.'},
{t:'What makes the cloud bill grow',
 table:{head:['Cost driver','What happens','Lever'],rows:[
  ['Compute','Paying for servers by the hour or second, even idle','Right size, autoscale down, use reserved or spot capacity for steady or flexible work'],
  ['Storage','Data kept forever, many copies','Lifecycle rules to move old data to cheaper tiers'],
  ['Data transfer (egress)','Moving data out of the cloud or across regions is charged','Keep chatty services in the same region; use a CDN'],
  ['Managed services','Convenient, priced for convenience','Compare against the engineer time you would spend'],
  ['Logs and monitoring','Log everything at high volume gets expensive','Sample, set retention, drop noisy logs'],
  ['AI usage','Charged per token or per GPU hour','See the LLM module: model size, caching, routing']]},
 so:'Ask for cost per transaction or per active user, not just the monthly total. Rising total with flat cost per user is healthy growth; rising cost per user is a problem.'}
];

window.XDEEP.m5=[
{t:'Authentication, authorization, accounting: the three A\'s',
 table:{head:['Question','Name','Typical tools','Bank example'],rows:[
  ['Who are you?','Authentication (AuthN)','Password, OTP, biometrics, passkeys, device binding','Login with PIN plus device check'],
  ['What may you do?','Authorization (AuthZ)','Roles, permissions, policies','A teller can view but not approve a loan'],
  ['What did you do?','Accounting or audit','Immutable logs','Who changed this customer address, and when']]},
 list:['MFA (Multi-Factor Authentication) combines something you know, have or are. SMS OTP is better than nothing but weak against SIM swap; app based or hardware factors are stronger.','Passkeys replace passwords with device bound cryptographic keys and resist phishing.','Session: how long a login lasts. Short sessions are safer and more annoying. It is a product trade-off.'],
 so:'Most real breaches are broken authorization (user A can fetch user B\'s data by changing an id), not broken passwords. Ask how the team tests that one customer cannot read another\'s data.'},
{t:'OAuth 2.0, OpenID Connect, SAML and JWT',
 table:{head:['Standard','Purpose','Used for'],rows:[
  ['OAuth 2.0','Delegated access: let app A act on your data in service B with limited scope, without giving it your password','"Allow this app to read your account statement"'],
  ['OIDC (OpenID Connect)','A login layer on top of OAuth that tells the app who the user is','"Sign in with Google"'],
  ['SAML (Security Assertion Markup Language)','Older XML based single sign on for companies','Employee login to enterprise tools'],
  ['JWT (JSON Web Token)','A signed token with claims inside, for example user id and expiry','Access tokens sent in the Authorization header']]},
 code:{label:'A JWT has three parts separated by dots: header.payload.signature. The payload (decoded) looks like this',text:'{\n  "sub": "user_42",\n  "scope": "payments:read",\n  "iat": 1790000000,\n  "exp": 1790000900\n}\n// exp is 15 minutes after iat. Anyone can read the payload;\n// only the signature proves it was not changed. Never put secrets inside.'},
 so:'Scopes are a product surface: "read balance" and "move money" should be separate permissions the user sees clearly on the consent screen.'},
{t:'Encryption, hashing and keys',
 table:{head:['Concept','What it does','Reversible?','Use for'],rows:[
  ['Encryption in transit (TLS, the "S" in HTTPS)','Scrambles data moving over the network','Yes, with keys','Every connection, no exceptions'],
  ['Encryption at rest','Scrambles stored data on disks and backups','Yes, with keys','Databases, files, backups'],
  ['Hashing (with salt, using bcrypt or argon2)','One way fingerprint','No','Passwords: store the hash, never the password'],
  ['Tokenization','Replace a sensitive value with a random token; the real value lives in a vault','Only via the vault','Card numbers (PCI DSS scope reduction)'],
  ['Masking','Show part of a value','No','Display "XXXX XXXX XXXX 4321"'],
  ['Key management (KMS, HSM)','Keys stored and rotated in dedicated secure systems','n/a','Keep keys out of code and out of the database']]},
 so:'Encryption protects against stolen disks, not against a logged in attacker or a bug that returns data to the wrong user. It is necessary, not sufficient.'},
{t:'The OWASP Top 10 in plain words',
 p:['OWASP (Open Worldwide Application Security Project) publishes the most common web risks. Names change by edition, but these themes stay constant. See the link in Go deeper for the current list.'],
 table:{head:['Risk','Plain meaning','Example','Defence'],rows:[
  ['Broken access control','Users reach data or actions they should not','Changing /orders/101 to /orders/102 shows someone else\'s order','Check permission on the server for every request'],
  ['Injection','Attacker data is run as a command','SQL injection through a search box','Parameterised queries, input validation'],
  ['Cryptographic failures','Weak or missing encryption','Passwords stored in plain text','Strong standard algorithms, TLS everywhere'],
  ['Insecure design','The feature itself is unsafe','No limit on OTP attempts','Threat modelling before building'],
  ['Security misconfiguration','Unsafe defaults','Public storage bucket, debug mode on','Hardened templates, automated checks'],
  ['Vulnerable components','Old libraries with known holes','Unpatched framework','Dependency scanning, regular updates'],
  ['Authentication failures','Weak login protections','No rate limit on login','MFA, lockouts, breached password checks'],
  ['Logging and monitoring failures','Attacks go unnoticed','No alert on 10,000 failed logins','Central logs and alerts']]},
 so:'Add "threat model done" and "security review done" to the definition of done for any feature that touches money, identity or personal data.'},
{t:'Threat modelling in five questions (STRIDE)',
 list:['What are we building? Draw the boxes and arrows (users, app, API, database, third parties).','What can go wrong? STRIDE helps: Spoofing (fake identity), Tampering (changing data), Repudiation (denying an action), Information disclosure (leaks), Denial of service (overload), Elevation of privilege (gaining extra rights).','What will we do about it? Prevent, detect, accept, or transfer the risk.','Did we do a good job? Test it: abuse cases, penetration test.','Who owns each risk? A named person, with a date.'],
 so:'A 45 minute whiteboard session at design time finds problems that cost 100 times more to fix after launch.'},
{t:'Privacy and compliance quick map for India',
 table:{head:['Rule or standard','Applies to','What a PM must plan for'],rows:[
  ['DPDP Act 2023 (Digital Personal Data Protection)','Personal data of people in India','Clear consent, purpose limits, data minimisation, a way to withdraw consent and erase data, breach reporting. Check current rules and timelines with legal counsel.'],
  ['RBI payment data storage directive','Payment system operators','Payment data stored only in India (foreign processing allowed with deletion and return rules). Affects region and vendor choice.'],
  ['PCI DSS (Payment Card Industry Data Security Standard)','Anyone who stores, processes or transmits card data','Avoid storing card numbers; use a certified gateway and tokens.'],
  ['ISO 27001, SOC 2','Vendors and enterprise customers','Often a sales requirement; evidence of security processes.'],
  ['GDPR (General Data Protection Regulation)','Data of people in the EU','Applies to Indian companies serving EU users.']]},
 p:['This is orientation, not legal advice. Rules change; confirm with your legal and compliance team.'],
 so:'Privacy by design means asking "do we need this field at all?" before building. Data you never collect cannot leak.'}
];

window.XDEEP.m6=[
{t:'Data pipelines: ETL, ELT, batch and streaming',
 table:{head:['Term','Meaning','Use when'],rows:[
  ['ETL (Extract, Transform, Load)','Clean data before storing it in the warehouse','Strict schemas, smaller data, older tools'],
  ['ELT (Extract, Load, Transform)','Load raw data first, transform inside the warehouse','Modern cloud warehouses, flexible analysis'],
  ['Batch','Process data in chunks, for example nightly','Reports, reconciliations, model training'],
  ['Streaming','Process each event within seconds','Fraud checks, live dashboards, alerts'],
  ['CDC (Change Data Capture)','Copy database changes as they happen to another system','Keep the warehouse fresh without hammering the main database']]},
 so:'Streaming costs more and is harder to debug. Ask "what decision changes if this data is 5 seconds fresh rather than 1 day fresh?" If the answer is none, use batch.'},
{t:'Warehouse, lake and lakehouse',
 table:{head:['Store','Holds','Strength','Weakness','Examples'],rows:[
  ['Data warehouse','Cleaned, structured tables','Fast SQL, trusted numbers','Costly for raw or unstructured data','BigQuery, Snowflake, Redshift'],
  ['Data lake','Raw files of any type','Cheap, flexible','Becomes a "swamp" without governance','S3, ADLS, GCS'],
  ['Lakehouse','Lake storage with warehouse style tables and rules','One copy serves BI and ML','Newer, needs skill','Databricks, Delta Lake, Iceberg']]},
 list:['Data quality checks: freshness, completeness, duplicates, ranges. Failing checks should stop bad data from reaching dashboards.','Data lineage: tracing a dashboard number back to its source tables. Without it, nobody trusts the numbers.','Data contract: a written agreement between the team producing data and the team consuming it.'],
 so:'Two dashboards showing different "active users" is a definition problem. Agree on metric definitions in one place before building more charts.'},
{t:'How a classic ML project actually runs',
 list:['1. Frame the problem and the decision it drives (approve or decline a loan, flag a transaction).','2. Define the target and the success metric with the business, including the cost of each type of error.','3. Collect and clean data. Usually 60 to 80 percent of the effort.','4. Build features (inputs) such as "number of transactions in the last hour".','5. Split data into train, validation and test sets so you can measure honestly.','6. Train, compare against a simple baseline (even a rule), and pick a model.','7. Deploy as a service or batch job, with monitoring.','8. Watch for drift and retrain.'],
 so:'Always ask for the baseline. If a simple rule gets 90 percent and the model 91 percent, the model may not be worth its running cost.'},
{t:'Precision, recall and the confusion matrix with real numbers',
 p:['Imagine a fraud model checks 10,000 transactions. 100 are truly fraud. The model flags 120. Of those flags, 80 are real fraud and 40 are innocent customers blocked by mistake. It missed 20 real frauds.'],
 table:{head:['','Predicted fraud','Predicted fine'],rows:[
  ['Actually fraud','80 (true positives)','20 (false negatives, missed)'],
  ['Actually fine','40 (false positives, wrongly blocked)','9,860 (true negatives)']]},
 list:['Precision = 80 / (80 + 40) = 0.67. Of everything flagged, two thirds is really fraud.','Recall = 80 / (80 + 20) = 0.80. The model catches 80 percent of all fraud.','Accuracy = (80 + 9,860) / 10,000 = 99.4 percent. It sounds great but a model that always says "fine" scores 99.0 percent. This is why accuracy misleads on rare events.','Threshold: raise it to block fewer customers (higher precision, lower recall) or lower it to catch more fraud (higher recall, lower precision). That is a business choice, not a data science one.'],
 so:'Put a price on each error. If a missed fraud costs Rs 8,000 and a wrongly blocked customer costs Rs 300 in support and goodwill, choose the threshold that minimises total cost.'},
{t:'Overfitting, leakage, drift and fairness',
 table:{head:['Problem','What it is','How you notice','Fix'],rows:[
  ['Overfitting','Model memorises training data','Great on training, poor on new data','More data, simpler model, proper validation'],
  ['Data leakage','Training data accidentally includes the answer or future information','Too good to be true results that vanish in production','Careful feature review, time based splits'],
  ['Data drift','Real world inputs change (new fraud tactics, festival season)','Input statistics shift','Monitor inputs, retrain on schedule or trigger'],
  ['Concept drift','The meaning of the target changes','Accuracy decays','Retrain with fresh labels'],
  ['Bias and fairness','Model treats groups differently because of skewed data','Compare error rates across groups','Audit, rebalance data, human review, document limits']]},
 so:'Plan for the model on day 100, not only day 1. Who monitors it, how often it is retrained, and what happens when it degrades are product requirements.'},
{t:'A/B testing basics',
 list:['Split users randomly into control (A) and variant (B). Change one thing.','Pick the primary metric before the test and a guardrail metric that must not get worse (for example refund rate).','Decide the minimum effect worth detecting. Smaller effects need many more users.','Run for whole weeks to cover weekday patterns. Do not stop the moment it looks good (peeking inflates false wins).','Statistical significance (commonly p below 0.05) says the difference is unlikely to be chance. It does not say the effect is large or worth shipping.'],
 table:{head:['Baseline rate','Lift you want to detect','Rough users needed per group'],rows:[
  ['5 percent conversion','Up 10 percent relative (5.0 to 5.5)','About 31,000'],
  ['5 percent conversion','Up 20 percent relative (5.0 to 6.0)','About 8,000'],
  ['20 percent conversion','Up 10 percent relative (20 to 22)','About 6,500']]},
 p:['Figures are approximate for 80 percent power and 5 percent significance. Use a sample size calculator for real planning.'],
 so:'Small products often cannot detect small lifts. If traffic is low, test bigger changes or use qualitative research instead of declaring noise a win.'}
];

window.XDEEP.m7=[
{t:'Tokens, context windows and what you pay for',
 p:['An LLM reads and writes tokens: pieces of words. In English, 1 token is about 4 characters or three quarters of a word. Hindi and other Indian language scripts often use more tokens for the same meaning, which raises cost and uses up the context window sooner.','The context window is the maximum tokens the model can consider in one call: your instructions, the conversation so far, retrieved documents, and the answer being written.'],
 table:{head:['Item','Counts as','Priced'],rows:[
  ['System prompt and instructions','Input tokens','Per million input tokens'],
  ['Conversation history and retrieved documents','Input tokens','Same, and they are re-sent every turn'],
  ['The model answer','Output tokens','Usually several times the input price'],
  ['Cached prompt prefix (where supported)','Cheaper input','Large discount for repeated long prefixes']]},
 code:{label:'Cost worked example (illustrative prices, check your provider)',text:'Assume input $3 per 1M tokens, output $15 per 1M tokens.\nOne support chat call: 3,000 input tokens + 500 output tokens\n  input  = 3,000 / 1,000,000 x $3  = $0.009\n  output =   500 / 1,000,000 x $15 = $0.0075\n  total  = $0.0165 per call\n\n200,000 calls per month = $3,300\nIf history grows and input becomes 9,000 tokens, input cost triples:\n  total = $0.0345 per call = $6,900 per month'},
 so:'Cost grows with context length. Long prompts, long history and many retrieved chunks are the usual reason a pilot that cost Rs 20,000 becomes a Rs 20 lakh surprise.'},
{t:'How a model produces an answer, and the knobs you control',
 p:['A model predicts the next token again and again, using probabilities. That is why it can sound confident and still be wrong: it is built to continue text plausibly, not to look up facts.'],
 table:{head:['Setting','Effect','Typical choice'],rows:[
  ['Temperature','Higher gives more varied output, lower gives more repeatable output','Low (0 to 0.3) for extraction and support; higher for brainstorming'],
  ['Max output tokens','Caps length and cost','Set deliberately'],
  ['System prompt','Role, rules, tone, format','Version it like code'],
  ['Structured output (JSON schema)','Forces a fixed format','Needed when other software reads the answer'],
  ['Stop sequences','Where the model must stop','For templated output'],
  ['Streaming','Send words as they are produced','Improves perceived speed; time to first token matters more than total time']]},
 so:'Latency has two parts: time to first token (TTFT) and tokens per second. A chat screen feels fast if the first words appear in under a second even when the full answer takes 10.'},
{t:'RAG step by step: Retrieval Augmented Generation',
 list:['1. Prepare: split documents into chunks (for example 300 to 800 tokens with some overlap).','2. Embed: turn each chunk into a list of numbers (a vector) that captures meaning, using an embedding model.','3. Store: put vectors plus the original text and metadata (source, date, access rights) in a vector database.','4. At question time: embed the question and find the closest chunks (similarity search). Often combined with keyword search (hybrid) for exact terms such as product codes.','5. Rerank: a second model reorders the top results by true relevance.','6. Prompt: give the model the question, the best chunks and the instruction "answer only from these sources and cite them".','7. Answer with citations; log everything for evaluation.'],
 table:{head:['Failure','Cause','Fix'],rows:[
  ['Right document, wrong answer','Chunk cut in the middle of a table or rule','Chunk by structure (headings, tables)'],
  ['Misses the document','Poor embeddings or no keyword match','Hybrid search, query rewriting'],
  ['Shows data the user must not see','Access rights not applied in retrieval','Filter by user permission before retrieval'],
  ['Out of date answer','Index not refreshed','Re-index on change, show document date'],
  ['Confident answer with no source','No refusal rule','Instruct to say "I do not know" and require citations']]},
 so:'RAG quality is mostly data quality. Ask who owns the source documents, how stale they can be, and who removes a wrong document.'},
{t:'Prompting, RAG, fine-tuning and distillation: which to choose',
 table:{head:['Approach','What it changes','Use when','Cost and effort','Risk'],rows:[
  ['Better prompt and examples (few-shot)','The instructions','Always start here','Hours','Prompt drift as models change'],
  ['RAG','The knowledge the model can see','Facts are private or change often','Weeks','Retrieval quality and access control'],
  ['Fine-tuning','The model\'s behaviour, style, format','Stable task, high volume, consistent tone','Weeks plus data labelling','Needs good data; knowledge goes stale'],
  ['Distillation','A smaller model learns from a bigger one','High volume narrow task, cost or latency matters','Weeks','Narrower ability'],
  ['Larger or better base model','Raw capability','Hard reasoning tasks','Just a config change','Higher cost per call']]},
 so:'Facts go in with RAG, behaviour goes in with fine-tuning. Teams often fine-tune to add facts and then wonder why it still gets them wrong.'},
{t:'Evals: how to know the AI is good enough',
 list:['Build a golden set: 50 to 200 real questions with the expected answer or a scoring guide. Include hard, rare and adversarial cases.','Score with a mix: exact match where possible, human review, and LLM as judge (check the judge against humans).','Track groups: answer accuracy, citation correctness, refusal when it should refuse, tone, latency, cost per answer.','Run evals on every prompt, model or data change, like unit tests. Block release if scores fall.','Sample live conversations weekly and add new failures to the golden set.'],
 table:{head:['Risk','Typical guard'],rows:[
  ['Hallucination (made up facts)','Retrieval with citations, "say I do not know", verify high stakes answers'],
  ['Prompt injection (text in a document tells the model to misbehave)','Treat retrieved text as data, limit tool permissions, filter outputs'],
  ['Data leakage','Do not send secrets or personal data to models without a contract and masking'],
  ['Unsafe or off brand output','Output filters, policy prompts, human escalation'],
  ['Provider outage or model change','Fallback model, pinned versions, regression evals']]},
 so:'"No eval set, no launch" is the single most useful rule in AI product work. The OWASP LLM Top 10 in Go deeper lists the main security risks.'},
{t:'Cost and speed levers',
 table:{head:['Lever','How it helps','Trade-off'],rows:[
  ['Model routing','Send easy requests to a small model and hard ones to a big model','Needs a router and evals for each path'],
  ['Prompt caching','Reuse the long fixed part of the prompt','Prefix must stay identical'],
  ['Shorter context','Retrieve fewer, better chunks; summarise history','May lose detail'],
  ['Batch API','Cheaper for non urgent jobs','Results arrive later'],
  ['Response caching','Return stored answers for repeated questions','Staleness and personalisation limits'],
  ['Smaller or on-device model (SLM)','Lower cost, lower latency, private','Weaker on hard tasks']]},
 so:'Ask for cost per resolved task, not per call. An agent that needs 6 calls to solve a ticket costs 6 times the single call number.'}
];

window.XDEEP.m8=[
{t:'The agent loop and a tool call in detail',
 p:['An agent is a model in a loop: it decides the next step, calls a tool (a function or API), reads the result, and repeats until the goal is met or a limit is hit. The model never touches your systems directly. Your code runs the tool and returns the result.'],
 list:['1. Goal and rules arrive (system prompt plus user request).','2. Model replies either with a final answer or with a tool request.','3. Your code checks the request against permissions, runs the tool, and returns the result.','4. Model reads the result and decides again.','5. Stop when done, when a step or cost limit is reached, or when it needs a human.'],
 code:{label:'What a tool request and result look like (simplified)',text:'// You describe the tool to the model\n{ "name": "refund_order",\n  "description": "Refund an order up to Rs 2,000",\n  "input_schema": { "order_id": "string", "amount": "number" } }\n\n// Model decides to call it\n{ "type": "tool_use", "name": "refund_order",\n  "input": { "order_id": "ORD-5521", "amount": 1499 } }\n\n// Your code validates (limit, ownership, duplicate), runs it,\n// and sends the result back\n{ "type": "tool_result", "content": "Refund RF-901 created for Rs 1,499" }'},
 so:'The safety of an agent lives in the tools. A tool that can only refund up to Rs 2,000 for the logged in customer is safe even if the model is fooled. A tool that runs any SQL is not.'},
{t:'Workflow or agent? Pick the simplest thing that works',
 table:{head:['Pattern','Who decides the steps','Use when','Example'],rows:[
  ['Single prompt','You','One step, clear task','Summarise a ticket'],
  ['Prompt chain / fixed workflow','You, in code','Steps are known and stable','Extract fields, validate, write to CRM'],
  ['Router','Model picks a branch, you define branches','Several known request types','Route to billing, tech or sales flow'],
  ['Agent','The model','Steps unknown in advance, tools needed, mistakes can be caught','Investigate a failed settlement across systems'],
  ['Multi-agent','Several model roles','Large tasks with clearly separate roles; often over used','Research plus writer plus reviewer']]},
 p:['Anthropic\'s "Building effective agents" guide (in Go deeper) recommends starting with the simplest solution and adding agency only when it clearly improves results.'],
 so:'Every step of autonomy adds cost, latency and risk. If a workflow can do it, a workflow should do it.'},
{t:'MCP and tool design',
 p:['MCP (Model Context Protocol) is an open standard for connecting AI apps to tools and data through a common interface, so you build one connector instead of one per app. Think of it as a universal plug between models and your systems.'],
 table:{head:['Good tool design','Why'],rows:[
  ['Few, well named tools with clear descriptions','The model picks the right one more often'],
  ['Strict input schemas and validation','Stops malformed or dangerous calls'],
  ['Least privilege, scoped to the user','A leaked or fooled agent can do limited harm'],
  ['Read tools separate from write tools','Easy to require approval for writes'],
  ['Idempotent writes with request ids','Safe when the agent retries'],
  ['Clear error messages the model can act on','Agent recovers instead of looping']]},
 so:'Treat tool descriptions like UI copy. Poor wording is a common reason an agent chooses the wrong tool.'},
{t:'Memory, state and human in the loop',
 table:{head:['Kind','What it holds','Where'],rows:[
  ['Short term (context)','The current conversation and tool results','The prompt'],
  ['Working state','Plan, progress, intermediate results','A database or task record, so a crashed run can resume'],
  ['Long term memory','Facts about the user or past outcomes','A store with consent, expiry and a way to view and delete'],
  ['Knowledge','Company documents','RAG']]},
 list:['Approval gates: require a human to confirm irreversible or high value actions (payments, deletes, emails to customers).','Autonomy levels: suggest only, act with approval, act and report, fully autonomous. Raise the level only after evidence.','Kill switch: a way to stop all agent actions instantly.','Audit trail: every action, its inputs, and who approved it.'],
 so:'Ask "what is the worst thing this agent can do in one step, and who would notice?" and design the approval and limits from that answer.'},
{t:'Why agents fail and how to measure them',
 table:{head:['Failure','What it looks like','Guard'],rows:[
  ['Infinite or long loops','Keeps retrying, cost climbs','Step, time and spend limits'],
  ['Wrong tool or wrong arguments','Refunds the wrong order','Validation, confirmations, dry run mode'],
  ['Compounding errors','A small early mistake ruins later steps','Checkpoints and verification steps'],
  ['Prompt injection through tool output','A web page or email tells the agent to leak data','Treat tool output as untrusted, restrict tools'],
  ['Silent partial success','Did 4 of 5 steps and said done','Check final state against the goal'],
  ['Drift after a model update','Behaviour changes','Pinned versions and regression evals']]},
 list:['Measure: task success rate, steps per task, cost per task, time to complete, human escalation rate, harmful action rate.','Test on real tasks end to end, and also with deliberately adversarial inputs.','Roll out in shadow mode first: the agent proposes, humans act, you compare.'],
 so:'The Replit database deletion case in this module is a lesson in permissions and approvals, not in model intelligence.'}
];

window.XDEEP.m9=[
{t:'Walk-through: one UPI style payment across every layer',
 p:['Illustrative and simplified. Real systems add more checks. The point is to see every module in one flow.'],

  ['2','Edge','CDN and load balancer receive the HTTPS request','Regional outage','Is it multi-AZ?'],

  ['10','Back office','Daily reconciliation against settlement file','Unexplained breaks','Who owns breaks and how fast are they closed?']]},
 so:'Notice that the happy path is steps 1 to 7 and half of the product risk lives in steps 7 to 10.'},
{t:'Walk-through: an AI support assistant over company documents',

  ['API and auth','Gateway identifies the user and their entitlements','What each user is allowed to see'],
  ['Orchestrator','Service that builds the prompt, calls retrieval and the model, applies guardrails','Policy rules, refusal rules'],

  ['Standard business app','Web or mobile front end, monolith or modular monolith, relational database','Simplicity over scale'],

  ['Real time (chat, tracking)','WebSockets or push, message broker, in memory store','Connection cost and ordering'],

window.XDEEP.m10=[
{t:'Non-functional requirements with real numbers',
 p:['Functional requirements say what the product does. Non-functional requirements (NFRs) say how well. Vague ones are the root of many arguments late in a project. Use this table as a starter and fill the numbers with your team.'],
 table:{head:['Area','Vague','Testable'],rows:[
  ['Speed','Fast','p95 API latency under 400 ms; checkout LCP under 2.5 s on a mid range phone on 4G'],
  ['Availability','Always on','99.95 percent monthly for payment APIs; planned maintenance windows announced 7 days ahead'],
  ['Scale','Handles growth','500 requests per second at launch; tested to 3 times that'],
  ['Durability and recovery','Safe data','RPO 5 minutes, RTO 30 minutes, restore tested every quarter'],
  ['Security','Secure','MFA for money movement, all data encrypted in transit and at rest, penetration test before launch'],
  ['Privacy','Compliant','Consent recorded, delete request completed within 30 days, no personal data in logs'],
  ['Accessibility','Accessible','WCAG 2.2 level AA; text contrast at least 4.5 to 1'],
  ['Cost','Cheap','Cloud cost under Rs 2 per transaction; alert at 120 percent of budget'],
  ['Supportability','Easy to run','Dashboards, alerts and a runbook exist; on-call owner named']]},
 so:'Attach a number and a way to measure it to every NFR. If it cannot be measured it cannot be accepted or rejected.'},
{t:'Build, buy or partner: a scoring method',
 table:{head:['Factor','Question','Leans toward build','Leans toward buy'],rows:[
  ['Differentiation','Is this why customers choose us?','Core to our advantage','Commodity (email, payments rails, KYC checks)'],
  ['Time','How soon do we need it?','Time is available','Needed this quarter'],
  ['Total cost of ownership','Licence versus engineers, run costs and upgrades over 3 years','Cheaper at our scale','Cheaper than a team'],
  ['Control and data','Do we need control of data and roadmap?','Yes','Vendor is trusted and exportable'],
  ['Compliance','Does the vendor meet our rules and audits?','Rarely a reason to build','Certified vendors help'],
  ['Exit','How hard to leave?','n/a','Check data export, contract term, lock in']]},
 list:['Score each factor 1 to 5 with weights agreed with stakeholders. The number is less valuable than the conversation it forces.','Ask for a reference customer of your size and a proof of concept with your real data.'],
 so:'Buying does not remove engineering work. Integration, monitoring, and vendor management still need owners.'},
{t:'Technical debt and architecture decision records (ADR)',
 p:['Technical debt is the future cost of a shortcut. Like financial debt it is fine when it buys something valuable and when you track the interest.'],
 table:{head:['Type','Example','How to treat'],rows:[
  ['Deliberate and prudent','Hard code one bank integration to hit the launch date','Log it, set a payback date'],
  ['Accidental','Code grew messy as the team learned','Refactor when touching that area'],
  ['Outdated dependencies','Unsupported framework version','Schedule upgrades, cost of delay grows'],
  ['Missing tests or monitoring','Nobody knows if a release broke checkout','Make it part of the definition of done']]},
 code:{label:'ADR template (one page, stored with the code)',text:'Title: Use PostgreSQL for the ledger\nStatus: Accepted (2026-10-24)\nContext: Need strong consistency, audit trail, 500 writes per second.\nOptions: PostgreSQL, DynamoDB, MongoDB\nDecision: PostgreSQL with synchronous replica in a second zone.\nConsequences: Easy reporting and transactions; write scaling needs\n  sharding after about 5,000 writes per second. Revisit then.\nOwners: Payments platform team'},
 so:'Reserve a fixed share of each sprint (often 15 to 25 percent) for debt and reliability work, and report it in the same review as features.'},
{t:'Working with engineers: estimates, reviews, incidents',
 list:['Estimates are ranges with confidence, not promises. Ask for "likely 3 weeks, could be 5, here is what drives the spread". Reduce uncertainty with a spike (a short experiment).','Design review checklist: scale numbers, failure modes, data model, security and privacy, rollout and rollback, monitoring, cost, what we are not doing.','Definition of done for a feature: tests pass, dashboards and alerts exist, docs updated, rollout plan agreed, support briefed.','Incident basics: severity levels, one incident commander, a status update every 30 minutes for major incidents, a blameless postmortem within a week with owners and dates for each action.','Customer comms during outages: say what is affected, what you are doing, when the next update is. Do not guess a fix time.'],
 table:{head:['Severity','Example','Response'],rows:[
  ['SEV1','Payments down for most users','Page everyone, exec and customer comms, update every 30 minutes'],
  ['SEV2','One bank route failing, workaround exists','On-call plus owners, update hourly'],
  ['SEV3','Report delayed, no customer impact','Fix in business hours']]},
 so:'A blameless postmortem asks "what allowed this?" not "who did this?". People hide mistakes in blame cultures and the same incident repeats.'},
{t:'A 20 question architecture review for any feature',
 list:['1. What problem and what measurable outcome?','2. Who are the users and what devices and networks?','3. Expected traffic now, at peak, in a year?','4. What data do we create, read, change, and who owns it?','5. Which systems do we depend on, and what if each is down or slow?','6. Is any step money, identity or personal data related?','7. Which calls must be idempotent?','8. What is strongly consistent and what can be delayed?','9. How do we authenticate and authorize each action?','10. What is logged, and is any of it sensitive?','11. What are the latency and availability targets?','12. How do we release: flag, canary, or staged rollout?','13. How do we roll back, including data changes?','14. What do we monitor and who is paged?','15. What is the cost per unit, and the budget alert?','16. What is the manual fallback if the system fails?','17. Which regulations and policies apply?','18. What breaks for old app versions?','19. What are we deliberately not building?','20. What would make us stop or change the plan?'],
 so:'Use this list as the agenda for design reviews. After a few features your team will start answering most of it unprompted, which is the real goal.'}
];

<script>
(function(){

var $=function(s,r){return (r||document).querySelector(s)};

var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var fmt=function(n,d){d=d||0;return Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
