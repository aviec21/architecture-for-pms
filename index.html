  nav.hidden=false;document.body.classList.add('has-spy');
  var js=document.getElementById('jumpsel');if(js){js.innerHTML=spyList.map(function(s){return '<option value="'+s[0]+'">'+esc(s[1])+'</option>'}).join('');js.hidden=false;}
  nav.innerHTML='<ul>'+spyList.map(function(s){return '<li><button class="spy-b" data-spy="'+s[0]+'" aria-label="Jump to '+esc(s[1])+'"><span class="spy-l">'+esc(s[1])+'</span><span class="spy-d"></span></button></li>'}).join('')+'</ul>';
  spyActive='';spyUpdate();
}
function setSpy(id){
  if(id===spyActive)return;spyActive=id;
  var js2=document.getElementById('jumpsel');if(js2&&js2.value!==id)js2.value=id;
  $$('.spy-b').forEach(function(b){var on=b.dataset.spy===id;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
}
function spyUpdate(){
  if(!spyList.length)return;
  var mid=window.innerHeight/2,act=spyList[0][0],last=null,i,el;
  for(i=0;i<spyList.length;i++){
    el=document.getElementById(spyList[i][0]);
    if(!el||el.offsetParent===null)continue;
    last=spyList[i][0];
    if(el.getBoundingClientRect().top<=mid)act=spyList[i][0];
  }
  if(last&&window.innerHeight+window.pageYOffset>=document.documentElement.scrollHeight-4)act=last;
  setSpy(act);
}
function spyJump(id){
  var el=document.getElementById(id);if(!el)return;
  setSpy(id);spyLock=Date.now()+900;
  var r=el.getBoundingClientRect(),h=r.height,vh=window.innerHeight;
  var off=window.innerWidth<=900?76:20;
  var y=h<vh-120?r.top+window.pageYOffset+h/2-vh/2:r.top+window.pageYOffset-off;
  try{window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}catch(x){try{window.scrollTo(0,Math.max(0,y));}catch(z){}}
  setTimeout(spyUpdate,950);
}
function onScroll(){
  if(spyTick||Date.now()<spyLock)return;spyTick=true;
  window.requestAnimationFrame(function(){spyTick=false;spyUpdate();});
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);
var rzT=null;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(function(){if(tab==='practice')reserveAllQ();},250);});

/* ---------- Mobile drawer ---------- */
function setDrawer(open){
  document.body.classList.toggle('rail-open',!!open);
  var b=$('#menuBtn');if(b)b.setAttribute('aria-expanded',open?'true':'false');
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')setDrawer(false);});

/* ---------- Router ---------- */
function show(id){
  cur=id;
  if(id!=='map'&&id!=='glossary'&&id!=='exam'&&id!=='library')store.set('arch.last',id);
  renderRail();
  if(id==='map')renderMap();else if(id==='glossary')renderGlossary();else if(id==='exam')renderExam();else if(id==='library')renderLibrary();else renderModule(modById(id));
  try{window.scrollTo(0,0)}catch(e){}
  spySetup();
}
function go(id){
  if(!VALID[id])id='map';
  setDrawer(false);
  tab='learn';show(id);
  try{if(location.hash!=='#'+id)location.hash=id;}catch(e){}
}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){e.preventDefault();go(g.dataset.go);return;}
  var th=e.target.closest('[data-theme-set]');
  if(th){var tv=th.dataset.themeSet;store.set('arch.theme',tv);applyTheme(tv);renderRail();return;}
  var sp=e.target.closest('[data-spy]');
  if(sp){spyJump(sp.dataset.spy);return;}
  if(e.target.closest('[data-railtoggle]')){var mini=document.body.classList.toggle('rail-mini');store.set('arch.rail',mini?'mini':'open');renderRail();return;}
  if(e.target.closest('[data-railopen]')){setDrawer(true);return;}
  if(e.target.closest('[data-railclose]')){setDrawer(false);return;}
  var t=e.target.closest('[data-tab]');
  if(t){
    tab=t.dataset.tab;
    $$('.tab').forEach(function(b){var on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false')});
    $$('.panel').forEach(function(p){p.hidden=p.dataset.panel!==tab});
    spySetup();
    if(tab==='practice')reserveAllQ();
    return;
  }
  var o=e.target.closest('[data-qk]');
  if(o&&!o.disabled){answerQ(o.dataset.qk,+o.dataset.o);return;}
  var da=e.target.closest('[data-d]');
  if(da){drillAction(da.dataset.d,da.dataset.id);return;}
  if(e.target.closest('[data-newround]')){buildExam();renderExamBody();return;}
  if(e.target.closest('[data-qreset]')){
    var m=modById(cur);if(m){delete quizState[m.id];store.set('arch.quiz',quizState);renderQuiz(m);renderRail();}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='gq'){drawGlossary(t.value);return;}
  if(t.dataset&&t.dataset.tfilter!==undefined){
    var f=t.value.toLowerCase().trim();
    $$('.tcard').forEach(function(c){c.hidden=!!f&&c.dataset.term.indexOf(f)<0;});
    tcount();return;
  }
  if(t.dataset&&t.dataset.dv){var d1=DMAP[t.dataset.dv];if(d1)dstateOf(d1).val=t.value;return;}
  if(t.dataset&&t.dataset.dt){var d2=DMAP[t.dataset.dt];if(d2)dstateOf(d2).text=t.value;}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.id==='jumpsel'){spyJump(t.value);return;}
  if(t.dataset.pk){var d=DMAP[t.dataset.pk];if(d)dstateOf(d).picks[+t.dataset.i]=t.checked;return;}
  if(t.dataset.rb){var d3=DMAP[t.dataset.rb];if(d3){dstateOf(d3).rub[+t.dataset.i]=t.checked;drawDrill(d3);}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.dv){e.preventDefault();drillAction('check',e.target.dataset.dv);}
});
window.addEventListener('hashchange',function(){
  var id=(location.hash||'').slice(1);
  if(VALID[id]&&id!==cur){tab='learn';show(id);}
});

applyTheme(getTheme());
if(store.get('arch.rail','open')==='mini')document.body.classList.add('rail-mini');
var start=(location.hash||'').slice(1);
show(VALID[start]?start:'map');
syncPull();
})();
</script>
</body>
</html>
