var q=function(root,k){return root.querySelector('[data-k="'+k+'"]')};
var val=function(root,k){var el=q(root,k);return el?(parseFloat(el.value)||0):0};
var clamp=function(x,a,b){return Math.max(a,Math.min(b,x))};

/* ---------------------------------------------------------------- DATA */
var MODS=[
{id:'m0',n:0,title:'Big picture',layer:'Foundation',
blurb:'What happens between a tap and a result, and the five trade-offs behind every design decision.',
why:'Software has three jobs: show things to a user, move information around, and store the truth safely. One program doing all three breaks as soon as users grow. So the work is split into layers that can scale and change on their own. Architecture is the set of decisions about how to split, connect and protect those layers.',
analogy:'Think of a bank. The front end is the branch counter and the app screen. Middleware is the payment switch and clearing network (UPI is the best example). The back end is the core banking ledger. Security is the vault, KYC and audit trail.',
terms:[
['API','Application Programming Interface','A menu of requests one system lets another make, such as “give me the balance for account X”.'],
['HTTP / HTTPS','HyperText Transfer Protocol (Secure)','The language apps and browsers use to send requests and get responses. The S means encrypted.'],
['DNS','Domain Name System','The phone book that turns google.com into a machine address (an IP, or Internet Protocol, address).'],
['CDN','Content Delivery Network','Copies of images and files stored in servers near users so they load fast.'],
['Load balancer','','A traffic cop that spreads requests across several identical servers.'],
['Latency','','Time one request takes from tap to answer, measured in milliseconds (ms).'],
['Throughput','','How many requests the system handles per second.'],
['NFR','Non-Functional Requirement','How well the product must work (speed, uptime, security), as opposed to what it does.'],
['SLA / SLO / SLI','Service Level Agreement / Objective / Indicator','The SLA is the promise to customers, the SLO is the internal target, the SLI is the number actually measured.'],
['RPO / RTO','Recovery Point / Recovery Time Objective','RPO is how much data you can afford to lose. RTO is how long you can afford to be down.'],
['Single point of failure','','One part whose failure takes the whole system down.']
],
industry:['A UPI payment passes through the app, the bank servers, the NPCI switch (National Payments Corporation of India) and the receiving bank in a few seconds. Each hop adds delay and risk.','E-commerce firms set speed and uptime targets for checkout because a slow or broken checkout loses orders directly.'],
failures:['Designing for scale you do not have. A ten-person team running microservices and Kubernetes often ships slower than one with a simple server.','Treating non-functional requirements as an afterthought, then finding at launch that uptime or speed promises cannot be met.','Leaving a single point of failure that nobody listed.'],
pmq:['What load do we expect, and what happens at 10x?','What are our availability and data loss targets?','Which single part, if it fails, takes everything down?','What does this cost today and at 10x?'],
tables:[
{title:'The five trade-offs',head:['Trade-off','Question it asks','Typical tension'],rows:[
['Latency','How fast does it feel?','Caching is fast but can show stale data'],
['Cost','What do infrastructure and engineers cost?','More redundancy means a higher bill'],
['Reliability','Does it work every time and recover when it fails?','Higher uptime needs duplicate systems'],
['Security','How hard is it to misuse?','More checks add friction and delay'],
['Speed to ship','How quickly can we launch and change it?','Shortcuts now become tech debt later']]},
{title:'Layers and their bank equivalent',head:['Layer','Job','Bank equivalent','Example tech'],rows:[
['Front end','Shows screens, collects input','Branch counter, app','React, Flutter, Kotlin, Swift'],
['Middleware','Moves and routes requests reliably','Payment switch','API gateway, Kafka, queues'],
['Back end','Applies business rules','Core banking logic','Java, Python, Node services'],
['Data','Stores the official record','The vault','PostgreSQL, Redis, Amazon S3'],
['Infrastructure','Runs everything','Building and power supply','AWS, Azure, Google Cloud, Kubernetes'],
['Security','Protects all of it','Guards, KYC, audit','OAuth, TLS, WAF']]}
],
quiz:[
{q:'Which layer stores the final, official record of a payment?',opts:['Front end','API gateway','The database in the back end','CDN'],a:2,why:'The database holds the truth. Other layers pass it along or display it.'},
{q:'Going from 99.9% to 99.99% availability changes yearly downtime from about 8.8 hours to about:',opts:['5 hours','52 minutes','10 minutes','8 minutes'],a:1,why:'Each extra nine cuts allowed downtime by 10x, but it needs duplicate systems in several places, which is why cost rises steeply.'},
{q:'Why can a faster app sometimes show stale data?',opts:['Caching stores copies that may be older than the original','The database deletes old records','Servers run slower at night','Encryption removes data'],a:0,why:'A cache trades freshness for speed. The PM decides how stale is acceptable.'}
]},

{id:'m1',n:1,title:'Front end',layer:'What the user touches',
blurb:'The part that runs on the user’s device. Platform and rendering choices decide speed, reach and cost.',
why:'The front end runs on the user’s device, not on your servers. It shows data, collects input and talks to the back end through APIs. A good front end feels fast and clear. A bad one makes a perfect back end look broken.',
analogy:'The branch counter. Customers judge the bank by the counter, even though the ledger does the real work behind it.',
terms:[
['UI / UX','User Interface / User Experience','UI is what the user sees. UX is how it feels to use.'],
['HTML','HyperText Markup Language','The structure of a page: headings, buttons, forms.'],
['CSS','Cascading Style Sheets','The looks: colours, spacing, layout.'],
['JavaScript','','The behaviour: what happens on a click. Browsers only run JavaScript, so most web front ends use it.'],
['Framework','','A ready-made toolkit so teams do not start from scratch. React, Angular, Vue for web. React Native, Flutter for mobile.'],
['SDK','Software Development Kit','A packaged set of tools for building on a platform, such as the Android SDK.'],
['SPA','Single Page Application','One page that updates itself without reloading, like Gmail.'],
['CSR','Client-Side Rendering','The device builds the screen from JavaScript after loading.'],
['SSR','Server-Side Rendering','The server builds the full page and sends it ready.'],
['SSG','Static Site Generation','Pages are built once in advance and served as files.'],
['SEO','Search Engine Optimization','Making pages easy for Google to find and rank.'],
['PWA','Progressive Web App','A website that installs like an app and can work offline.'],
['LCP','Largest Contentful Paint','How fast the main content appears. Aim for under 2.5 seconds.'],
['INP','Interaction to Next Paint','How quickly the screen reacts to a tap. Aim for under 200 ms.'],
['CLS','Cumulative Layout Shift','Does the page jump around while loading? Lower is better.'],
['Feature flag','','A switch that turns a feature on or off without a new release, allowing gradual rollout and instant rollback.'],
['A/B test','','Show version A to half the users and B to the rest, then compare results.'],
['Backward compatibility','','The back end keeps supporting old app versions because users do not all update.']
],
industry:['Many Indian fintech and e-commerce apps ship native or cross-platform for device features and polish.','Content sites that depend on Google traffic favour server-side rendering or static pages for speed and ranking.','Lite PWAs target low-end phones and weak networks, where a large download loses users before they begin.'],
failures:['Business rules enforced only in the app. Anything on the user’s device can be inspected and changed, so the back end must always re-check.','Tested only on flagship phones, then slow for most real users.','Old app versions keep calling old APIs after a back end change, because users do not all update.'],
pmq:['Which platforms, devices and networks do our users actually have?','Which device features do we truly need: SMS, camera, biometrics, background work?','Is the content public (SEO matters) or behind login?','How do we roll out safely: flags, staged release, rollback?','Which analytics events must exist from day one?'],
tables:[
{title:'Where does the app live?',head:['Option','What it is','Benefit','Drawback','Industry use'],rows:[
['Web app','Runs in the browser','One codebase, instant updates, no store review','Limited device access, weaker offline','Dashboards, SaaS tools, net banking'],
['Native app','Separate Android (Kotlin) and iOS (Swift) apps','Best speed and full device features','Two codebases, higher cost','Payment apps, games, camera apps'],
['Cross-platform','One codebase for both (React Native, Flutter)','Cheaper and faster to ship both','Some performance and feature gaps','Many fintech and e-commerce apps'],
['PWA','A website that installs like an app and works offline','No store, small download, cheap','Fewer device features, limited on iOS','Lite apps for low-end phones']]},
{title:'How is the page built?',head:['Approach','Page is built by','Benefit','Drawback','Best for'],rows:[
['CSR','The user’s device, after JavaScript loads','Smooth once loaded, cheap hosting','Slow first view, weaker SEO','Logged-in tools and dashboards'],
['SSR','The server, on every request','Fast first view, good SEO','More server work and cost','Public pages with fresh content'],
['SSG','A build step, once, served from a CDN','Fastest and cheapest','Only fits content that rarely changes','Blogs, docs, marketing pages']]}
],
quiz:[
{q:'Why can the front end never be trusted to enforce a business rule?',opts:['It is too slow','Code on the user’s device can be inspected and changed','It cannot call APIs','Browsers block JavaScript'],a:1,why:'Whatever runs on the user’s device is in the user’s hands. The back end must re-check every rule that matters.'},
{q:'Which rendering approach suits a public blog that must rank on Google and rarely changes?',opts:['Client-side rendering only','Static site generation','A native app','A single page app behind login'],a:1,why:'Pre-built pages from a CDN are fastest and easy for search engines to read.'},
{q:'You need reach on cheap phones with weak data, and no SMS access. A good first choice is:',opts:['A heavy native app','A PWA','A desktop-only site','Two separate native apps'],a:1,why:'A PWA is small, installs fast and works on weak networks. You give up deep device features.'}
]},

{id:'m2',n:2,title:'Middleware',layer:'How systems talk',
blurb:'The plumbing between front end, back end and partners: gateways, APIs, queues and safe retries.',
why:'Systems need to talk to each other, and networks fail. Middleware is the plumbing that routes requests, absorbs spikes, retries safely and keeps messages from getting lost between the front end, the back end and partner systems.',
analogy:'The payment switch, or registered post. The sender does not wait at the receiver’s door. The post office holds the letter, tracks it and delivers it even if the receiver is out.',
terms:[
['API gateway','','The single front door: checks identity, applies limits, routes requests to the right service.'],
['REST','Representational State Transfer','Simple HTTP APIs built around resources such as /accounts/42.'],
['GraphQL','','The client asks for exactly the fields it needs in one call.'],
['gRPC','Google Remote Procedure Call','Fast binary calls between internal services with a strict contract.'],
['Webhook','','A callback: the partner calls your URL when something happens.'],
['BFF','Backend For Frontend','A thin API shaped for one client, such as the mobile app.'],
['Queue','','Holds messages until a consumer processes them. Examples: Amazon SQS (Simple Queue Service), RabbitMQ.'],
['Event streaming','','An ordered log of events that many consumers can read and replay. Example: Apache Kafka.'],
['Synchronous / asynchronous','','Wait for the answer now, or get it later.'],
['Rate limiting','','Capping how many requests one caller can make, to prevent abuse and overload.'],
['Retry','','Trying a failed request again. Safe only if the action is idempotent.'],
['Idempotency','','Doing the same request twice has the same effect as doing it once. Critical for payments.'],
['DLQ','Dead Letter Queue','A parking lot for messages that keep failing, so people can inspect them.'],
['Service mesh','','Infrastructure that manages traffic, security and retries between services.'],
['JSON','JavaScript Object Notation','The common text format for API data.']
],
industry:['UPI and bank switches use queues and status checks. A payment that times out is later settled as success or failure after reconciliation.','Payment gateways send webhooks to merchants when a payment settles.','Large apps use a BFF so the mobile app gets one compact response instead of making five calls.'],
failures:['Retrying a payment without idempotency charges the customer twice.','Chatty APIs: a screen that needs ten calls is slow on mobile networks.','Tight coupling: if service A waits on B, B’s outage becomes A’s outage.','A queue backlog nobody monitors. Messages pile up silently.'],
pmq:['What happens if the partner system is down for an hour?','Which actions must be idempotent, and what is the key?','Is the call synchronous because the user must wait, or only by habit?','How do we see stuck messages and replay them?'],
tables:[
{title:'API styles',head:['Style','What it is','Benefit','Drawback','Use when'],rows:[
['REST','Simple HTTP calls on resources','Easy, widely understood, cacheable','Can need many calls or return extra data','Most public and partner APIs'],
['GraphQL','Client asks for exactly the fields it needs','One call, no over-fetching','Harder to cache and secure','Mobile apps with rich screens'],
['gRPC','Fast binary calls with a strict contract','Speed and strong typing','Not browser friendly, harder to debug','Service-to-service inside the company'],
['Webhook','Partner calls your URL on an event','No polling, near real time','You must verify and handle retries','Payment confirmations, notifications']]},
{title:'Communication patterns',head:['Pattern','How it works','Benefit','Drawback','Example'],rows:[
['Synchronous','Caller waits for the answer','Simple, immediate result','One side’s failure hurts the other','Checking a balance'],
['Queue (async)','Message is stored and processed later','Absorbs spikes, safe retries','Result arrives later, needs a status screen','Payment instruction, emails'],
['Event stream','Ordered log many consumers can read and replay','Many systems react, full history','Harder to operate and reason about','Fraud feeds, analytics, audit trails']]}
],
quiz:[
{q:'A payment request times out and the user taps Pay again. What prevents a double debit?',opts:['A faster server','An idempotency key checked by the back end','A bigger database','Using GraphQL'],a:1,why:'The key lets the back end recognise the retry as the same payment and skip the second debit.'},
{q:'The receiving bank is down for 10 minutes. Which design loses the fewest payments?',opts:['Synchronous call with no retry','A queue that holds messages until the bank is back','Asking users to try later','Caching the response'],a:1,why:'A queue stores the instruction and delivers it when the partner returns.'},
{q:'Which tool suits a mobile screen that needs data from five services in one trip?',opts:['A BFF (Backend For Frontend)','A load balancer','A CDN','A webhook'],a:0,why:'A BFF combines the calls and returns one response shaped for that screen.'}
]},

{id:'m3',n:3,title:'Back end and data',layer:'Where logic and truth live',
blurb:'How code is split (monolith, microservices, serverless) and why one product uses several data stores.',
why:'The back end is where rules run and where truth is stored. The big choices are how to split the code and where each kind of data lives, because no single database is best at everything.',
analogy:'The core banking system. Rules decide what is allowed. The vault (database) keeps the official record. A cash desk keeps small change nearby (cache) and a records office handles old reports (warehouse).',
terms:[
['Monolith','','One program deployed as a single unit.'],
['Microservices','','Many small services, each deployed on its own.'],
['Serverless','','Code runs on demand and the cloud manages servers. Example: AWS Lambda.'],
['SQL','Structured Query Language','The language of relational databases, which store data in tables with strict rules.'],
['NoSQL','','Non-relational stores: document, key-value, wide-column.'],
['Cache','','A fast temporary copy of data, such as Redis, to avoid repeated slow lookups.'],
['ACID','Atomicity, Consistency, Isolation, Durability','Guarantees that a transaction completes fully or not at all and survives crashes.'],
['Transaction','','A group of changes that succeed or fail together, such as debit plus credit.'],
['CAP theorem','Consistency, Availability, Partition tolerance','When the network splits, a system must choose between always-correct answers and always-available answers.'],
['Eventual consistency','','Copies of data may differ briefly and converge later.'],
['Read replica','','A read-only copy of a database that shares the reading load.'],
['Sharding','','Splitting data across several databases by a key, such as customer ID.'],
['Data warehouse','','A store built for analysing huge history, such as BigQuery or Snowflake.'],
['Batch / stream','','Processing in scheduled chunks versus continuously as data arrives.'],
['Object storage','','Cheap storage for files and images. Example: Amazon S3 (Simple Storage Service).']
],
industry:['Banks keep ledgers in relational databases because money needs transactions.','E-commerce uses several stores at once: SQL for orders, a cache for sessions, a search engine for product search and a warehouse for analytics.','Many startups begin as a monolith and extract services only where scale or team size demands it.'],
failures:['Microservices too early produce a distributed monolith: many services that must all be released together.','A schemaless database for money, then discovering inconsistent balances.','Missing database indexes. Queries that were fast at 1,000 rows crawl at 10 million.','A cache treated as the source of truth, then data is lost on restart.','All reads and writes hitting one database that becomes the bottleneck.'],
pmq:['Where is the source of truth for each piece of data?','Which data must be strongly consistent, and which can be slightly stale?','What is the plan when this database is 10x bigger?','Do we need one service per team, or does a modular monolith do?'],
tables:[
{title:'How to split the code',head:['Style','Benefit','Drawback','Right when'],rows:[
['Monolith','Simple, fast to build, easy to debug','Grows tangled, one failure can hit everything','Early products and small teams'],
['Microservices','Teams ship independently, parts scale separately','Network calls, complex operations, hard debugging','Large organisations with clear domains'],
['Serverless','No servers to manage, pay per use','Cold starts, limits, vendor lock-in','Spiky or event-driven jobs']]},
{title:'Where to keep the data',head:['Store','Examples','Best at','Watch out for'],rows:[
['Relational (SQL)','PostgreSQL, MySQL','Transactions, joins, strong consistency','Harder to scale writes across machines'],
['Document (NoSQL)','MongoDB, Firestore','Flexible fields, fast iteration','Weak joins, consistency is on you'],
['Key-value cache','Redis, Memcached','Microsecond reads, automatic expiry','Data can vanish, not a source of truth'],
['Search engine','Elasticsearch, OpenSearch','Ranking, typo tolerance, full text','Lags behind the main database'],
['Data warehouse','BigQuery, Snowflake, Redshift','Fast analytics over huge history','Not for live transactions'],
['Object storage','Amazon S3, Cloud Storage','Cheap, huge files and images','No queries on file content']]}
],
quiz:[
{q:'Where should account balances and transfers live?',opts:['In a cache','A relational database with transactions','Object storage','A search index'],a:1,why:'Money needs all-or-nothing transactions and strong consistency.'},
{q:'A 6-person team has no proven product yet. Best starting architecture?',opts:['Fifteen microservices','A modular monolith','Custom hardware','One service per developer'],a:1,why:'A modular monolith ships fastest and can be split later, once real needs appear.'},
{q:'Heavy monthly reports are slowing the live app. What helps most?',opts:['Run reports on a data warehouse or replica','Add more buttons','Delete old data','Increase font size'],a:0,why:'Analytics should run away from the live transaction database.'}
]},

{id:'m4',n:4,title:'Infrastructure',layer:'Where it runs and how it stays up',
blurb:'Cloud, containers, release pipelines and monitoring. This layer decides how safely and how fast you can ship.',
why:'Code needs somewhere to run, and it must stay up while it changes. This layer covers cloud, containers, release pipelines and monitoring. It decides how fast you can ship safely and what happens at 3 a.m. when something breaks.',
analogy:'The bank building, power supply and maintenance crew. Branches can be added (scale), a generator takes over in a power cut (failover), and renovations happen floor by floor so the bank stays open (safe releases).',
terms:[
['IaaS','Infrastructure as a Service','Rent raw servers and manage everything above them.'],
['PaaS','Platform as a Service','You deploy code and the platform runs and scales it.'],
['SaaS','Software as a Service','A finished product you subscribe to.'],
['Region / Availability Zone','','A region is a geographic area. A zone is a separate data centre inside it.'],
['Container / Docker','','Code packaged with everything it needs so it runs the same anywhere.'],
['Kubernetes','','A system that runs, scales and heals many containers.'],
['CI/CD','Continuous Integration / Continuous Delivery','Automated build, test and release.'],
['IaC','Infrastructure as Code','Servers and networks defined in files that can be reviewed and repeated.'],
['Observability','','Logs, metrics and traces that show what the system is doing.'],
['Error budget','','The downtime your SLO allows. When it is spent, reliability work comes before features.'],
['Blue/green, canary','','Release styles that limit damage. See the Compare tab.'],
['DR','Disaster Recovery','The plan and setup to restore service after a major failure.'],
['FinOps','Financial Operations','Managing and optimising cloud cost.'],
['Data residency','','Rules requiring certain data to stay inside a country.']
],
industry:['Indian payment firms keep payment data in India, as RBI (Reserve Bank of India) rules require, so they choose cloud regions accordingly and document it.','Teams release with canaries: 1% of users first, then widen.','Cloud bills are a managed line item with owners and alerts, which is the point of FinOps.'],
failures:['A rollback that was never rehearsed, so a bad release takes hours to undo.','Monitoring that says the server is up but not whether payments succeed.','A single region or zone: one outage takes everything.','Cloud cost grows silently with no owner.'],
pmq:['What is our availability target and how is it measured?','How long does a rollback take, and when was it last tried?','Which alerts wake someone up, and which are noise?','What is our monthly cloud cost per active user and how does it trend?'],
tables:[
{title:'Cloud service models',head:['Model','You manage','Provider manages','Example'],rows:[
['IaaS','Operating system, runtime, app, data','Hardware and virtualisation','Amazon EC2 virtual machines'],
['PaaS','App code and data','Servers, operating system, runtime, scaling','Heroku, Google App Engine'],
['SaaS','Configuration and users','Everything else','Salesforce, Google Workspace']]},
{title:'Release strategies',head:['Strategy','How it works','Benefit','Risk'],rows:[
['Big bang','Replace everything at once','Simple','Highest risk, hard rollback'],
['Blue/green','Run old (blue) and new (green) side by side, switch traffic','Instant rollback','Needs double capacity'],
['Canary','Send 1% of users to the new version, then widen','Limits damage, real-world test','Needs good monitoring'],
['Feature flag','Ship code switched off, turn on per user group','Separates release from launch','Old flags pile up as debt']]}
],
quiz:[
{q:'Four components in a chain each have 99.9% availability. The whole chain is about:',opts:['99.9%','99.6%','100%','99.99%'],a:1,why:'Availabilities multiply: 0.999 x 0.999 x 0.999 x 0.999 is about 0.996. A chain is weaker than its weakest link.'},
{q:'Which release approach exposes a new version to 1% of users first?',opts:['Canary','Big bang','Cold start','Sharding'],a:0,why:'A canary release limits the damage of a bad version and gives real-world feedback.'},
{q:'The error budget is used up for the month. A sensible response is:',opts:['Ship more features faster','Pause risky releases and fix reliability','Ignore it','Raise the SLA'],a:1,why:'An exhausted budget means reliability is the priority until it recovers.'}
]},

{id:'m5',n:5,title:'Security',layer:'How it is protected',
blurb:'Identity, permissions, encryption and compliance, plus the new risks AI features bring.',
why:'Every layer can be attacked, and user trust and your licence to operate depend on getting this right. Security is also a product topic. It shapes login flows, data collection and what you are allowed to store.',
analogy:'Guards, locks, KYC and CCTV. You check who someone is (identity), what they may touch (permission), seal valuables (encryption) and keep a record of everything (audit).',
terms:[
['AuthN','Authentication','Who are you?'],
['AuthZ','Authorization','What are you allowed to do?'],
['OAuth 2.0','','Lets an app act on your behalf without learning your password.'],
['OIDC','OpenID Connect','A login layer built on top of OAuth.'],
['SSO','Single Sign-On','One login for many apps.'],
['MFA','Multi-Factor Authentication','Two or more proofs of identity, such as password plus OTP.'],
['JWT','JSON Web Token','A signed token that proves a user is logged in.'],
['TLS','Transport Layer Security','Encryption in transit. It is the S in HTTPS.'],
['Encryption at rest','','Stored data is scrambled so a stolen disk or backup is unreadable.'],
['Secrets manager','','A vault for keys and passwords so they never sit in code.'],
['RBAC','Role-Based Access Control','Permissions granted by role, such as agent or manager.'],
['Least privilege','','Give each person or system only the access it needs.'],
['Zero trust','','Never trust a request because of where it comes from. Verify every time.'],
['WAF','Web Application Firewall','Filters malicious web traffic before it reaches your app.'],
['DDoS','Distributed Denial of Service','Flooding a system with traffic to knock it offline.'],
['OWASP Top 10','Open Worldwide Application Security Project','A well-known list of the most common web security risks.'],
['PII','Personally Identifiable Information','Data that identifies a person, such as name, phone or PAN.'],
['STRIDE','','A threat checklist: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.'],
['Prompt injection','','Hidden instructions in content that hijack an AI model’s behaviour.']
],
industry:['Payment firms follow PCI DSS for card data and RBI rules for storage and security.','B2B software vendors pursue SOC 2 or ISO 27001 so enterprise buyers will sign.','Any product handling personal data of people in India must plan for the Digital Personal Data Protection Act, 2023.'],
failures:['IDOR (Insecure Direct Object Reference): changing an ID in a URL shows someone else’s data because the server checked login but not ownership.','API keys committed to code.','Collecting data you do not need, which raises breach impact and compliance duty.','Security added at the end, so fixes require redesign.'],
pmq:['Which data is personal or sensitive, and why do we need each field?','What happens if one user’s token is stolen?','Who can see what, and is that checked on the server every time?','Which compliance rules apply before we launch in this market?','For AI features, what can the model do if someone feeds it malicious text?'],
tables:[
{title:'Core security ideas',head:['Concept','Question','Example','Failure looks like'],rows:[
['Authentication (AuthN)','Who are you?','Password plus OTP, fingerprint','An attacker logs in as someone else'],
['Authorization (AuthZ)','What may you do?','Customers see only their own loans','A user reads or edits another person’s data'],
['Encryption in transit','Can others read it on the wire?','TLS on every connection','Data sniffed on public Wi-Fi'],
['Encryption at rest','Can others read stored data?','Encrypted disks and fields','A stolen backup is readable']]},
{title:'Compliance frameworks',head:['Framework','Covers','Typical trigger'],rows:[
['PCI DSS','Payment Card Industry Data Security Standard: card data handling','Storing or processing card numbers'],
['SOC 2','System and Organization Controls: audited security and availability controls','Selling software to enterprises'],
['ISO 27001','An information security management standard','Enterprise and government tenders'],
['DPDP Act, 2023','India’s Digital Personal Data Protection Act: consent and duties for personal data','Any product handling personal data of people in India'],
['RBI directions','Reserve Bank of India rules for banks, NBFCs (non-bank lenders) and payment firms','Lending, payments, data storage for regulated entities']]}
],
quiz:[
{q:'A user changes the ID in a URL and sees another customer’s loan. Which control was missing?',opts:['Object-level authorization','Faster servers','A CDN','Dark mode'],a:0,why:'The server must check that the logged-in user owns the record on every request.'},
{q:'Authentication answers which question?',opts:['What may you do?','Who are you?','How fast are you?','Where are you stored?'],a:1,why:'Authentication proves identity. Authorization decides permissions.'},
{q:'Which risk is specific to AI agents that read outside content?',opts:['Prompt injection','Slow CSS','Large images','A missing favicon'],a:0,why:'Text inside a document or web page can carry instructions that hijack the model.'}
]},

{id:'m6',n:6,title:'Data and classic ML',layer:'Learning from data before LLMs',
blurb:'Pipelines, features and models that score, rank and forecast. Often cheaper and more explainable than an LLM.',
why:'Before LLMs, machine learning already powered scoring, ranking and forecasting. These systems learn patterns from labelled historical data. Knowing when a small, cheap, explainable model beats an LLM saves money and keeps you inside regulation.',
analogy:'A seasoned credit officer who has seen 100,000 files and scores new ones by pattern is classic ML. A smart generalist who reads and writes well but has not seen your files is an LLM.',
terms:[
['Data pipeline','','Moves and cleans data from sources to where it is used.'],
['ETL','Extract, Transform, Load','Pull data out, reshape it, load it into a target store.'],
['Feature','','An input signal for a model, such as “missed payments in 6 months”.'],
['Feature store','','A shared, consistent source of features for training and live use.'],
['Label','','The known right answer in historical data, such as “defaulted” or “repaid”.'],
['Training / inference','','Training learns from data. Inference makes a prediction on new data.'],
['Model drift','','The world changes and accuracy quietly decays.'],
['Data leakage','','Training on information that will not exist at decision time, which inflates test results.'],
['Precision','','Of the cases flagged, how many were truly positive.'],
['Recall','','Of all true positives, how many were caught.'],
['Batch / real-time inference','','Scoring in scheduled runs versus instantly per request.'],
['MLOps','Machine Learning Operations','Deploying, monitoring and updating models reliably.'],
['Explainability','','Being able to say why the model made a decision, often required by regulators.']
],
industry:['Lenders score applicants with gradient-boosted trees or logistic regression on bureau and behaviour data.','Banks and card networks score each transaction for fraud within milliseconds.','Retailers forecast demand weekly. LLMs appear around the edges, summarising cases or drafting messages.'],
failures:['Drift: a model trained before a festive season or policy change quietly gets worse.','Leakage: great test results, poor real results.','Choosing an LLM for a numeric scoring job. It is slower, costlier and harder to explain to a regulator.','No monitoring after launch.'],
pmq:['What is the label, and how long until we know the true outcome?','Which error costs more: a false alarm or a miss?','How will we detect drift?','Can we explain a decision to a customer or regulator?'],
tables:[
{title:'Classic ML versus LLM',head:['Aspect','Classic ML','LLM'],rows:[
['Best data','Structured tables and numbers','Text, documents, conversation'],
['Output','A score or class','Free text or structured text'],
['Cost per prediction','Very low','Higher'],
['Speed','Milliseconds','Hundreds of milliseconds to seconds'],
['Explainability','Easier (feature importance)','Harder'],
['Needs training data','Yes, labelled history','Often none, uses prompts'],
['Typical use','Credit score, fraud, forecast','Summaries, chat, extraction']]}
],
quiz:[
{q:'A model flags 100 transactions and 80 are truly fraud. Precision is:',opts:['20%','80%','100%','8%'],a:1,why:'Precision is true positives divided by everything flagged: 80 out of 100.'},
{q:'Which task fits classic ML best?',opts:['Summarising a contract','Real-time fraud scoring on card transactions','Writing a poem','Answering free-form questions'],a:1,why:'Structured data, millisecond speed and low cost per prediction point to classic ML.'},
{q:'Accuracy drops after a policy change. This is called:',opts:['Model drift','Sharding','Caching','Rendering'],a:0,why:'The world no longer matches the data the model learned from.'}
]},

{id:'m7',n:7,title:'LLMs and SLMs',layer:'The language model layer',
blurb:'What the models are, how to pick a size, how to give them your knowledge, and how to control cost and quality.',
why:'LLMs read and write language, which lets software handle unstructured work: text, documents, conversation. The product choices are which model size to use, how to give it your knowledge, how to control cost and how to measure quality.',
analogy:'Hiring. An LLM is a senior generalist: costly, slower, handles anything. An SLM is a trained specialist: cheap, fast, narrow. RAG is handing them your company handbook before they answer. Fine-tuning is sending them on a training course.',
terms:[
['LLM','Large Language Model','A very large model trained on huge text that can read, write and reason in language.'],
['SLM','Small Language Model','A smaller model that is cheaper, faster and can often run on a phone or modest server.'],
['Token','','A chunk of text the model reads or writes. Roughly 4 characters of English.'],
['Context window','','How much text the model can read at once, including your prompt and its answer.'],
['Parameters','','The learned numbers inside a model. More usually means more capable and more costly.'],
['Inference','','Running the model to get an answer.'],
['Temperature','','A setting for randomness. Low is steady, high is more varied.'],
['Prompt / system prompt','','The instructions and context sent to the model. The system prompt sets its standing behaviour.'],
['Embedding','','A list of numbers that captures the meaning of text, so similar meanings sit close together.'],
['Vector database','','A store that finds the closest embeddings quickly. Used to retrieve relevant passages.'],
['RAG','Retrieval-Augmented Generation','Fetch relevant documents first, then let the model answer from them.'],
['Fine-tuning','','Training a model further on your own examples.'],
['Distillation','','Training a small model to copy a large one on a narrow task.'],
['Quantization','','Shrinking the numbers in a model so it runs cheaper and smaller.'],
['Hallucination','','A fluent answer that is wrong or invented.'],
['Guardrails','','Checks before and after the model that block unsafe or off-policy output.'],
['Eval','','A test set that measures quality, so you can tell whether a change helped.'],
['TTFT','Time To First Token','How long before the first word appears. It drives how fast the app feels.'],
['Open-weight / closed','','Open-weight models can be downloaded and run yourself. Closed ones are used only through the provider’s API.'],
['Model routing','','Sending each request to the cheapest model that can handle it.'],
['Prompt caching','','Reusing repeated prompt parts at lower cost and latency.']
],
industry:['Support bots use RAG over help articles, with a handoff to a human.','Teams route easy requests to a small model and hard ones to a large model to cut cost.','On-device small models handle private or offline tasks such as keyboard suggestions and voice commands.'],
failures:['Hallucination: fluent, wrong answers, worst when users trust them.','Using an LLM for deterministic work such as arithmetic or policy checks.','Shipping without an eval set, so you cannot tell whether a change helped.','Stuffing huge context into every call, which multiplies cost and latency.','Locking into one vendor with no fallback.'],
pmq:['What is the quality bar, and how do we measure it on real examples?','What is the cost per request and the monthly bill at 10x?','What is the latency budget, and does the user see streaming output?','What happens when the model is wrong, slow or down?','What data leaves our environment, and is that allowed?'],
tables:[
{title:'Choosing a model tier',head:['Option','What it is','Benefit','Drawback','Use when'],rows:[
['Large cloud LLM','Top model behind an API','Best reasoning and language skill','Highest cost and latency, data leaves your systems','Hard, open-ended or high-value tasks'],
['Small model (SLM) in cloud','Smaller model you call or host','Cheap, fast, good on narrow tasks','Weaker on complex reasoning','Classification, extraction, routing, simple chat'],
['On-device model','Tiny model on the phone or laptop','Private, offline, no per-call cost','Limited ability, uses battery and memory','Voice commands, keyboards, on-device assistants']]},
{title:'Giving the model your knowledge and behaviour',head:['Approach','What it does','Benefit','Drawback','Choose when'],rows:[
['Prompting','Instructions and examples in the request','Fastest, no training, easy to change','Long prompts cost more, limited by context','Always try this first'],
['RAG','Retrieve relevant documents and add them to the prompt','Fresh, company-specific facts, citations','Quality depends on retrieval, adds latency','Answers from changing knowledge'],
['Fine-tuning','Train further on your examples','Consistent style, shorter prompts, cheaper small models','Needs data and evals, knowledge goes stale','Stable behaviour at high volume']]}
],
quiz:[
{q:'The model must answer from internal policy documents that change weekly. Best first approach?',opts:['Fine-tune every week','RAG over the documents','Raise the temperature','Use a bigger screen'],a:1,why:'RAG reads the current documents at answer time, so updates need no retraining.'},
{q:'Which change most reduces cost for a high-volume, simple classification task?',opts:['Route it to a small model','Use the largest model','Add more examples to every prompt forever','Increase output length'],a:0,why:'A small model handles narrow tasks at a fraction of the price.'},
{q:'What is a token?',opts:['A chunk of text the model reads or writes','A password','A database row','A server'],a:0,why:'Models read and write in tokens, and pricing is per token.'}

{id:'m8',n:8,title:'Agents',layer:'Software that chooses its own steps',
blurb:'When to let a model plan and call tools, and why reliability compounds against you.',
why:'A workflow follows steps you wrote. An agent decides its own steps, calls tools and loops until the goal is met. That flexibility suits open-ended tasks and is risky for anything that must be exact, because errors compound across steps.',
analogy:'A workflow is a checklist an assistant follows. An agent is an assistant given a goal and a toolbox who works out the steps. You give the second one a limited budget, limited access and a manager who signs off on big actions.',
terms:[
['Agent','','A model in a loop that plans, uses tools, reads results and repeats until done.'],
['Workflow','','A fixed sequence of steps you designed, possibly with an LLM in some steps.'],
['Tool calling','','The model asks the system to run a function, such as search or send email, and reads the result.'],
['MCP','Model Context Protocol','An open standard for connecting models to tools and data sources.'],
['Memory','','Short-term lives in the prompt. Long-term lives in a store the agent reads and writes.'],
['ReAct loop','Reason and Act','Think, act with a tool, observe, think again.'],
['Orchestrator','','The code that runs the loop, enforces limits and calls tools.'],
['Multi-agent','','Several agents with different roles working together.'],
['Human-in-the-loop','','A person approves or reviews before risky actions run.'],
['Trace','','A full record of prompts, tool calls and results for debugging and audit.'],
['Sandbox','','An isolated environment where the agent’s actions cannot harm real systems.'],
['Step and cost limits','','Hard caps on steps, time and spend so runs cannot go on forever.']
],
industry:['Coding assistants read files, run tests and edit code in a loop.','Support triage agents look up orders, then draft refunds for human approval.','Back-office agents reconcile documents but pass money movement to deterministic code.'],
failures:['Compounding errors: ten steps at 95% each finish correctly only about 60% of the time.','Runaway loops and cost with no step limit.','Over-permissioned tools: an agent that can delete or pay can be tricked into doing so.','Prompt injection through tool results such as web pages or emails.','No trace, so failures cannot be debugged.'],
pmq:['Do we need an agent, or would a fixed workflow do?','Which actions are irreversible, and who approves them?','What are the step, time and cost limits?','How do we log and replay every run?','Which parts stay deterministic code?'],
tables:[
{title:'From single call to multi-agent',head:['Pattern','Who decides the steps','Predictability','Cost and latency','Use when'],rows:[
['Single LLM call','You','High','Low','Summarise, classify, rewrite'],
['Workflow','You, with the LLM filling steps','High','Medium','Known process such as document intake'],
['Single agent','The model','Medium to low','Higher','Open-ended tasks that need tools'],
['Multi-agent','Several models','Lower','Highest','Rarely, only when roles truly separate']]}
],
quiz:[
{q:'Ten steps at 95% success each finish correctly about:',opts:['95%','80%','60%','40%'],a:2,why:'0.95 multiplied by itself ten times is about 0.60. Errors compound.'},
{q:'Which step should stay in deterministic code?',opts:['Debiting an account','Drafting a friendly message','Summarising a report','Understanding a slang request'],a:0,why:'Money movement must be exact, repeatable and logged. Models are for language.'},
{q:'A strong safeguard for irreversible actions is:',opts:['Human approval before execution','A longer prompt','Higher temperature','More agents'],a:0,why:'A person confirming the action contains the damage from a wrong or hijacked decision.'}
]},

{id:'m9',n:9,title:'Reference architectures',layer:'How the pieces combine',
blurb:'Five complete designs, one step at a time, so you can see which choices repeat.',
why:'Real products combine all the layers. Seeing five end-to-end designs shows what repeats: queues around partners, rules in code, models at the edges and humans at the risky points.',
analogy:'Floor plans. After learning the rooms (layers), read a few complete plans and notice where the doors and load-bearing walls sit.',
terms:[
['KYC','Know Your Customer','Identity checks a regulated firm must complete before onboarding a customer.'],
['eKYC','Electronic KYC','KYC done digitally, such as with Aadhaar-based verification or DigiLocker documents.'],
['PSP','Payment Service Provider','The app or company that connects users to the payments network.'],
['NPCI','National Payments Corporation of India','The organisation that operates UPI, India’s retail payments switch.'],
['e-mandate','','Digital authorisation to debit an account on a schedule.'],
['Reconciliation','','Matching your records with a partner’s to find and fix mismatches.'],
['ASR','Automatic Speech Recognition','Turns speech into text.']
],
industry:['UPI apps, digital lenders, support bots, AI assistants and voice agents all follow the same few patterns, shown in the Lab tab.'],
failures:['Copying a big-company design for a small product.','Drawing the happy path only. Every arrow needs a failure plan.','Putting the model in charge of steps that need exactness.'],
pmq:['Which step is the single point of failure?','Where do we wait on a partner, and what is the fallback?','Which steps are decided by rules, which by models, which by humans?','What do we log at each step?'],
tables:[
{title:'The five designs side by side',head:['Architecture','Main pattern','Biggest risk','Modules it uses'],rows:[
['UPI-style payment','Synchronous front, asynchronous partners, reconcile','Unknown outcome after a timeout','0, 1, 2, 3, 5'],
['Digital lending app','Rules and models decide, code moves money','Vendor downtime, explainability, compliance','1, 2, 5, 6'],
['RAG support bot','Retrieve, then generate, with guardrails','Bad retrieval and confident wrong answers','2, 5, 7'],
['Agentic assistant','Agent loop with narrow tools and approvals','Compounding errors and over-permissioned tools','5, 7, 8'],
['On-device hybrid voice agent','Small model locally, large model as fallback','Wrong routing and fragile app control','1, 5, 7, 8']]}
],
quiz:[
{q:'In a UPI-style payment, what handles a timeout where the final status is unknown?',opts:['Status check and reconciliation','Deleting the request','A bigger CDN','Ignoring it'],a:0,why:'Unknown outcomes are resolved later by status checks and matching records with partners.'},
{q:'In a RAG support bot, what does the retriever do?',opts:['Finds relevant passages to give the model','Trains the model','Draws the interface','Encrypts the database'],a:0,why:'Retrieval supplies the facts. Weak retrieval is the top cause of wrong answers.'},
{q:'Why keep a cloud fallback in an on-device voice agent?',opts:['Hard requests may exceed the small model','Phones cannot hear','Clouds are always cheaper','To avoid using tokens'],a:0,why:'The small local model is fast and private but limited. Hard cases escalate.'}
]},

{id:'m10',n:10,title:'PM playbook',layer:'Using all of this in reviews and PRDs',
blurb:'Questions to ask, decisions to record and a checklist to run before launch.',
why:'Your job is not to design the system. It is to ask questions that expose risk and trade-offs early, and to write requirements engineers can build against. This module turns the earlier layers into a repeatable review.',
analogy:'A building inspector who is not the architect. They do not draw the plans, but they know which walls carry the load and which questions to ask before anyone moves in.',
terms:[
['ADR','Architecture Decision Record','A short note saying what was decided, why, and what else was considered.'],
['Tech debt','','A shortcut taken now that costs more to fix later.'],
['Build vs buy','','Make it yourself or license it. A choice about speed, control, cost and risk.'],
['TCO','Total Cost of Ownership','The full cost over time: licences, people, hosting, support and exit.'],
['Vendor lock-in','','Being unable to leave a supplier without large cost or rework.'],
['Spike','','A time-boxed investigation to answer a technical question.'],
['Runbook','','A step-by-step guide for handling a known incident.'],
['Postmortem','','A blameless review after an incident, ending in concrete actions.'],
['Tech spec','','The engineering document describing how a feature will be built.']
],
industry:['Mature teams keep ADRs in the code repository so newcomers see why choices were made.','Launch reviews use a checklist across security, privacy, reliability and cost before go-live.','Postmortems are blameless and end with owners and dates.'],
failures:['Asking questions only at the end, when change is expensive.','Accepting jargon as an answer. Ask for a number or an example.','Treating tech debt as free. It needs a paydown plan.','Choosing a vendor on demo quality alone and ignoring exit cost.'],
pmq:['What would make you change this decision?','What is the worst failure, and how would we know?','What is the cheapest version that tests the idea?','What does this cost per user at 10x?'],
tables:[
{title:'What to ask, by layer',head:['Layer','Ask','Red flag answer'],rows:[
['Front end','Which devices and networks did you test on?','Only the latest phones'],
['Middleware','What happens on retry and on partner downtime?','We have not thought about it'],
['Back end','Where is the source of truth?','It is in three places'],
['Data','How do we restore from backup and how long does it take?','We take backups but never restored one'],
['Infrastructure','How fast can we roll back?','We cannot'],
['Security','Who can see this data and how is it checked?','The app hides the button'],
['AI','How do we measure quality and handle wrong answers?','We tried a few prompts and it looked good']]}
],
quiz:[
{q:'What does an ADR record?',opts:['A decision, its reasons and the options considered','The server password','The cloud invoice','A screen mockup'],a:0,why:'It preserves the why, so later teams can judge whether the decision still holds.'},
{q:'Which is the strongest answer to “how do we know the AI feature works?”',opts:['It looked fine in a demo','We have an eval set with pass rates and a fallback','The vendor said so','Users will tell us'],a:1,why:'A repeatable measurement plus a plan for failure is what a launch needs.'},
{q:'Building rather than buying is most justified when the capability is:',opts:['A commodity','Core to your differentiation and handles sensitive data','Needed tomorrow with no team','Cheap to license'],a:1,why:'Build what makes you different or what you cannot safely hand over. Buy the rest.'}
]}
];

var ARCHS=[
{name:'UPI-style payment',pattern:'Synchronous front, asynchronous partners, reconcile the unknowns.',flow:[
{n:'Payment app',t:'Android or iOS app (PSP app)',d:'Collects payee and amount, asks for the UPI PIN on a secure screen and sends the request over HTTPS.',r:'Slow networks cause timeouts. Show a pending state and never guess the result.'},
{n:'PSP backend',t:'API gateway, authentication, services',d:'Checks the user and device, applies limits, attaches an idempotency key and forwards to the switch.',r:'Retries can duplicate a payment. The idempotency key prevents a double debit.'},
{n:'UPI switch',t:'NPCI (National Payments Corporation of India)',d:'Routes the instruction between the sender’s bank and the receiver’s bank and records the transaction.',r:'Shared infrastructure. You depend on its uptime and rules.'},
{n:'Sender bank',t:'Core banking',d:'Checks the balance and debits the sender in one all-or-nothing transaction.',r:'Declines and delays. Map every error code to a clear message.'},
{n:'Receiver bank',t:'Core banking',d:'Credits the receiver and confirms back.',r:'Credit can lag, so the status may stay pending.'},
{n:'Status and reconciliation',t:'Queues, status checks, nightly matching',d:'Resolves unknown outcomes, sends notifications and matches records with partners.',r:'Unreconciled money is a trust and compliance issue.'}
]},
{name:'Digital lending app',pattern:'Rules and models decide, code moves the money, vendors everywhere.',flow:[
{n:'Mobile app',t:'Native or cross-platform',d:'Onboarding forms, document capture and consent screens.',r:'Drop-off at every step. Measure the funnel from day one.'},
{n:'API gateway and login',t:'OTP login, device binding, rate limits',d:'Authenticates the user and protects every call.',r:'Account takeover and abuse. Use MFA and limits.'},
{n:'KYC service',t:'PAN check, eKYC or DigiLocker, face match',d:'Verifies identity through third-party APIs and stores consent.',r:'Vendor downtime and consent rules. Plan a fallback vendor.'},
{n:'Credit decision',t:'Bureau pull, scoring model, rules engine',d:'A model scores risk and a rules engine applies policy to approve, reject or refer.',r:'Drift, explainability and fairness. Keep decisions auditable.'},
{n:'Offer and e-sign',t:'Agreement, Key Fact Statement, eSign, e-mandate',d:'Shows terms, collects signature and sets up repayment debits.',r:'Disclosures must be exact. Do not generate them freely with a model.'},
{n:'Disbursal',t:'Payment API and ledger',d:'Sends funds directly to the borrower’s bank account and records the loan.',r:'Failed or duplicate payouts. Idempotency and reconciliation are required.'},
{n:'Servicing and collections',t:'Reminders, repayment, bureau reporting, support assistant',d:'Handles repayments, reminders and customer questions.',r:'Conduct rules for recovery. Review any AI-written messages.'}
]},
{name:'RAG support bot',pattern:'Retrieve first, then generate, with checks on both sides.',flow:[
{n:'Chat interface',t:'Web widget or in-app chat',d:'Streams the answer, shows sources and offers a human handoff.',r:'Users trust fluent wrong answers. Show citations and an escape hatch.'},
{n:'API and login',t:'Authentication, per-user rate limits',d:'Identifies the user and caps usage.',r:'Abuse and cost spikes.'},
{n:'Orchestrator',t:'Application code',d:'Builds the prompt, calls the retriever and model and applies policies.',r:'Logic grows messy. Version it and test it.'},
{n:'Retriever',t:'Embeddings plus vector and keyword search',d:'Turns the question into an embedding and finds the best passages from your help content.',r:'Bad retrieval is the top cause of bad answers. Test it on its own.'},
{n:'LLM',t:'Model API or hosted model',d:'Answers using only the retrieved passages and the system instructions.',r:'Hallucination, cost per call and time to first token.'},
{n:'Guardrails and logging',t:'Policy checks, PII filters, logs',d:'Checks output for policy breaks and unsupported claims, and records traffic for evals.',r:'Over-blocking frustrates users. Under-blocking is a risk.'},
{n:'Ingestion and evals',t:'Offline pipeline',d:'Chunks documents, embeds them, re-indexes on change and runs nightly test questions.',r:'Stale documents produce stale answers.'}
]},
{name:'Agentic assistant',pattern:'An agent loop with narrow tools, approvals and a full audit trail.',flow:[
{n:'Interface',t:'Chat, voice or inbox',d:'Takes the goal, shows the plan and asks for approval on risky steps.',r:'Users over-trust the assistant. Make actions visible.'},
{n:'Orchestrator loop',t:'Model plus control code',d:'The model plans, calls tools, reads results and repeats, within step, time and cost limits.',r:'Compounding errors and runaway loops. Enforce hard limits.'},
{n:'Tool layer',t:'MCP servers and APIs',d:'Calendar, email, CRM and search, each with narrow permissions.',r:'Over-permissioned tools. Grant least privilege.'},
{n:'Approval gate',t:'Human-in-the-loop',d:'A person confirms irreversible actions such as sending, paying or deleting.',r:'Approval fatigue. Only gate what matters.'},
{n:'Memory',t:'Short-term context plus a long-term store',d:'Keeps preferences and past task results.',r:'Stale or wrong memories and privacy exposure.'},
{n:'Trace and audit log',t:'Logging pipeline',d:'Stores every prompt, tool call and result.',r:'Without it, failures cannot be debugged or defended.'}
]},
{name:'On-device hybrid voice agent',pattern:'A small model on the phone first, a large model only when needed.',flow:[
{n:'Microphone and trigger',t:'Android audio capture, push to talk',d:'Captures speech when the user asks for it.',r:'Battery use and microphone permissions.'},
{n:'On-device ASR',t:'Automatic Speech Recognition on the phone',d:'Converts speech to text locally.',r:'Accents, noise and language coverage.'},
{n:'On-device SLM router',t:'Small language model',d:'Turns text into an intent and decides: handle locally, replay a saved action, or escalate.',r:'Wrong routing. Test with an eval set.'},
{n:'Action executor',t:'Android intents and accessibility services',d:'Performs taps and app actions on the user’s behalf.',r:'Breaks when apps update. Permissions are sensitive.'},
{n:'Local action memory',t:'On-device store',d:'Saves recorded actions as reusable recipes.',r:'Security of stored data. Let the user inspect and delete.'},
{n:'Cloud LLM fallback',t:'Large model API',d:'Handles requests the small model cannot, sending only the text it needs.',r:'Cost, latency and data leaving the device.'}
]}
];

var LABS={};

LABS.m0=function(root){
  var hops=[['App builds the request',30],['DNS lookup',20],['CDN and edge',15],['Load balancer',5],['API gateway: identity and limits',40],['Back end: rules and fraud check',80],['Database write',30],['Partner bank via queue',120],['Response back to the app',25]];
  var hv=hops.map(function(h){return h[1]});
  root.innerHTML=
  '<div class="card"><h2>1. Latency budget for one payment</h2><p class="hint">Drag each hop and watch the total move against your budget.</p>'+
  '<div class="row"><label class="field"><span>Budget (ms)</span><input type="number" data-k="budget" value="500" min="50" step="50"></label></div>'+
  '<div class="hops">'+hops.map(function(h,i){return '<label class="hop"><span>'+esc(h[0])+'</span><input type="range" min="0" max="300" step="5" value="'+h[1]+'" data-hop="'+i+'" aria-label="'+esc(h[0])+' in milliseconds"><output data-out="'+i+'">'+h[1]+' ms</output></label>'}).join('')+'</div>'+
  '<div class="stackbar" data-k="bar"></div><p class="readout" data-k="lat"></p></div>'+
  '<div class="card"><h2>2. How many servers do we need?</h2><p class="hint">A rough sizing exercise you can use to sanity check an engineer’s numbers.</p>'+
  '<div class="row"><label class="field"><span>Registered users</span><input type="number" data-k="users" value="1000000" min="1000" step="100000"></label>'+
  '<label class="field"><span>Active in the peak minute (<b data-k="pctout">2%</b>)</span><input type="range" data-k="pct" min="0.5" max="10" step="0.5" value="2"></label>'+
  '<label class="field"><span>One server handles (req/s)</span><input type="number" data-k="per" value="100" min="1" step="10"></label>'+
  '<label class="field"><span>Headroom</span><select data-k="head"><option value="1.2">1.2x</option><option value="1.5" selected>1.5x</option><option value="2">2x</option></select></label></div>'+
  '<div class="result" data-k="capout"></div></div>'+
  '<div class="card"><h2>3. What does an uptime target really allow?</h2>'+
  '<div class="row"><label class="field"><span>Availability target</span><select data-k="avail"><option value="99">99%</option><option value="99.5">99.5%</option><option value="99.9" selected>99.9%</option><option value="99.95">99.95%</option><option value="99.99">99.99%</option><option value="99.999">99.999%</option></select></label></div>'+
  '<div class="stats" data-k="availout"></div></div>';
  function upLat(){
    var total=hv.reduce(function(a,b){return a+b},0),b=val(root,'budget');
    q(root,'bar').innerHTML=hv.map(function(v,i){return '<i style="flex:'+Math.max(v,0.001)+' 1 0;opacity:'+(0.35+(i%3)*0.25)+'" title="'+esc(hops[i][0])+': '+v+' ms"></i>'}).join('');
    var big=hv.indexOf(Math.max.apply(null,hv)),over=total-b;
    q(root,'lat').innerHTML='Total <strong>'+total+' ms</strong> against a budget of '+b+' ms. '+(over>0?'<span class="bad">Over by '+over+' ms.</span>':'<span class="good">'+(-over)+' ms to spare.</span>')+' Biggest hop: '+esc(hops[big][0])+' ('+hv[big]+' ms, '+(total?Math.round(hv[big]/total*100):0)+'% of the total).';
  }
  function upCap(){
    var users=val(root,'users'),pct=val(root,'pct'),per=Math.max(val(root,'per'),1),head=val(root,'head');
    var rps=users*pct/100/60,base=Math.ceil(rps/per),rec=Math.ceil(rps/per*head)+1;
    q(root,'pctout').textContent=pct+'%';
    q(root,'capout').innerHTML='<p>Peak load: <strong>'+fmt(rps)+' requests per second</strong>.</p><p>Bare minimum: '+base+' server'+(base===1?'':'s')+'. With '+head+'x headroom plus one spare for a failure: <strong>'+rec+' servers</strong>.</p>';
  }
  function upAvail(){
    var a=val(root,'avail'),f=(100-a)/100,yr=f*525600,mo=f*43200;
    q(root,'availout').innerHTML='<div class="stat"><b>'+human(yr)+'</b><span>allowed downtime per year</span></div><div class="stat"><b>'+human(mo)+'</b><span>allowed downtime per month</span></div>';
  }
  function onAny(e){
    var t=e.target;
    if(t.dataset.hop!==undefined){hv[+t.dataset.hop]=+t.value;var o=root.querySelector('[data-out="'+t.dataset.hop+'"]');if(o)o.textContent=t.value+' ms';}
    upLat();upCap();upAvail();
  }
  root.addEventListener('input',onAny);root.addEventListener('change',onAny);
  upLat();upCap();upAvail();
};

LABS.m1=function(root){
  var names=['Web app','Native app','Cross-platform','PWA'];
  var needs=[
    ['device','Needs SMS, biometrics or deep device access',[0,2,1,0]],
    ['offline','Must work well offline',[0,2,2,1]],
    ['lowend','Users on cheap phones and weak data',[2,0,1,2]],
    ['seo','Public pages that must rank in search',[2,0,0,2]],
    ['perf','Heavy animation or top performance',[0,2,1,0]],
    ['budget','One small team, one codebase',[2,0,2,2]],
    ['store','Must be listed in the app stores',[0,2,2,1]]
  ];
  var on={device:true,budget:true,store:true};
  var rend={
    pub:['SSR (Server-Side Rendering)','The server builds each page, so the first view is fast and search engines see full content, even when content changes often.'],
    stat:['SSG (Static Site Generation)','Build the pages once and serve them from a CDN. Fastest and cheapest for content that rarely changes.'],
    app:['CSR (Client-Side Rendering), as a single page app','The device builds the screen after login. Search ranking does not matter here and the app feels smooth once loaded.']
  };
  root.innerHTML=
  '<div class="card"><h2>1. Pick a platform</h2><p class="hint">Tick what your product truly needs. Scores show how well each option fits.</p>'+
  '<div class="chips">'+needs.map(function(n){return '<label class="chk"><input type="checkbox" data-need="'+n[0]+'"'+(on[n[0]]?' checked':'')+'><span>'+esc(n[1])+'</span></label>'}).join('')+'</div>'+
  '<div data-k="res"></div><p class="readout" data-k="verdict"></p></div>'+
  '<div class="card"><h2>2. Pick a rendering style</h2><p class="hint">What kind of pages are you building?</p>'+
  '<div class="chips"><label class="chk"><input type="radio" name="render" value="pub"><span>Public pages that must rank and change often</span></label>'+
  '<label class="chk"><input type="radio" name="render" value="stat"><span>Public pages that rarely change</span></label>'+
  '<label class="chk"><input type="radio" name="render" value="app" checked><span>A logged-in tool or dashboard</span></label></div>'+
  '<div class="result" data-k="rend"></div></div>';
  function draw(){
    var sel=needs.filter(function(n){return on[n[0]]}),max=sel.length*2;
    var sc=names.map(function(nm,i){return sel.reduce(function(a,n){return a+n[2][i]},0)});
    var best=Math.max.apply(null,sc);
    q(root,'res').innerHTML=names.map(function(nm,i){return '<div class="bar-row'+(max>0&&sc[i]===best?' top':'')+'"><span>'+nm+'</span><div class="track"><i style="width:'+(max?sc[i]/max*100:0)+'%"></i></div><b>'+sc[i]+'/'+max+'</b></div>'}).join('');
    var tops=names.filter(function(nm,i){return sc[i]===best});
    q(root,'verdict').innerHTML=!max?'Tick at least one need.':(tops.length>1?'<span class="warn">Close call between '+tops.join(' and ')+'.</span> Decide using your next most important need. Fit scores are a thinking aid, not a verdict.':'<span class="good">Best fit: '+tops[0]+'.</span> Fit scores are a thinking aid, not a verdict.');
  }
  function drawR(v){q(root,'rend').innerHTML='<p><strong>'+esc(rend[v][0])+'</strong></p><p>'+esc(rend[v][1])+'</p>';}
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.need){on[t.dataset.need]=t.checked;draw();}
    if(t.name==='render'){drawR(t.value);}
  });
  draw();drawR('app');
};

LABS.m2=function(root){
  var A={mode:'sync',down:false,sent:0,ok:0,fail:0,queue:0,log:[]};
  var B={bal:1000,debits:0,taps:0,seen:false,log:[]};
  root.innerHTML=
  '<div class="card"><h2>1. What happens when a partner is down?</h2><p class="hint">Send a few payments, take the receiving bank down, send more, then bring it back.</p>'+
  '<div class="row"><label class="field"><span>Design</span><select data-k="amode"><option value="sync">Synchronous, no queue</option><option value="queue">Queue with retry</option></select></label>'+
  '<button class="btn" data-act="send">Send payment</button><button class="btn ghost" data-act="toggle" data-k="adown">Take receiver bank down</button><button class="btn ghost" data-act="resetA">Reset</button></div>'+
  '<p class="state" data-k="astate"></p><div class="stats" data-k="astats"></div><ul class="log" data-k="alog"></ul></div>'+
  '<div class="card"><h2>2. The double-tap problem</h2><p class="hint">The customer means to pay 200 once. The network times out, so they tap Pay again. Every tap is a retry of the same payment.</p>'+
  '<div class="row"><label class="chk"><input type="checkbox" data-k="idem" checked><span>Back end uses an idempotency key</span></label><button class="btn" data-act="tap">Tap Pay</button><button class="btn ghost" data-act="resetB">Reset</button></div>'+
  '<div class="stats" data-k="bstats"></div><ul class="log" data-k="blog"></ul></div>';
  function stat(l,v,alert){return '<div class="stat'+(alert?' alert':'')+'"><b>'+v+'</b><span>'+l+'</span></div>'}
  function drawA(){
    q(root,'astate').innerHTML=A.down?'<span class="bad">Receiver bank: DOWN</span>':'<span class="good">Receiver bank: UP</span>';
    q(root,'adown').textContent=A.down?'Bring receiver bank back up':'Take receiver bank down';
    q(root,'astats').innerHTML=stat('Sent',A.sent)+stat('Delivered',A.ok)+stat('Failed',A.fail,A.fail>0)+stat('Waiting in queue',A.queue);
    q(root,'alog').innerHTML=A.log.slice(-6).map(function(l){return '<li>'+esc(l)+'</li>'}).join('');
  }
  function drawB(){
    var over=B.debits>1;
    q(root,'bstats').innerHTML=stat('Balance',fmt(B.bal))+stat('Times charged',B.debits,over)+stat('Customer intended',1);
    q(root,'blog').innerHTML=(over?'<li><span class="bad">Customer was charged '+B.debits+' times for one purchase.</span></li>':'')+B.log.slice(-5).map(function(l){return '<li>'+esc(l)+'</li>'}).join('');
  }
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='send'){
      A.sent++;
      if(!A.down){A.ok++;A.log.push('Payment '+A.sent+' delivered.');}
      else if(A.mode==='sync'){A.fail++;A.log.push('Payment '+A.sent+' failed. Receiver unreachable, so the user sees an error and the outcome is unclear.');}
      else{A.queue++;A.log.push('Payment '+A.sent+' queued. The user sees Processing.');}
    }
    if(a==='toggle'){
      A.down=!A.down;
      if(!A.down&&A.queue>0){A.ok+=A.queue;A.log.push('Receiver is back. '+A.queue+' queued payment'+(A.queue===1?'':'s')+' delivered.');A.queue=0;}
      else A.log.push(A.down?'Receiver bank went down.':'Receiver bank is back up.');
    }
    if(a==='resetA'){A.down=false;A.sent=A.ok=A.fail=A.queue=0;A.log=[];}
    if(a==='tap'){
      B.taps++;
      var keyed=q(root,'idem').checked;
      if(keyed&&B.seen){B.log.push('Tap '+B.taps+' ignored. The key was already processed, so no new debit.');}
      else{B.bal-=200;B.debits++;B.seen=true;B.log.push('Tap '+B.taps+' debited 200.');}
    }
    if(a==='resetB'){B={bal:1000,debits:0,taps:0,seen:false,log:[]};}
    drawA();drawB();
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.k==='amode'){A.mode=t.value;A.log.push('Switched to '+(A.mode==='sync'?'synchronous calls':'a queue with retry')+'.');drawA();}
    if(t.dataset.k==='idem'){B={bal:1000,debits:0,taps:0,seen:false,log:[]};drawB();}
  });
  drawA();drawB();
};

function syncFetch(url,opt,ms){
  return new Promise(function(resolve,reject){
    var done=false,t=setTimeout(function(){if(!done){done=true;reject(new Error('timeout'))}},ms||8000);
    fetch(url,opt).then(function(r){if(done)return;done=true;clearTimeout(t);resolve(r)},function(e){if(done)return;done=true;clearTimeout(t);reject(e)});
  });

  clearTimeout(syncTimer);
  var body=JSON.stringify({ts:store.get('arch.ts',Date.now()),data:syncSnapshot()});
  setSync('saving');
  syncFetch('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:body,keepalive:!!keep&&body.length<60000},8000)
    .then(function(r){setSync(r.ok?'ok':'off')},function(){setSync('off')});

  SYNC_KEYS.forEach(function(k){if(remote.data&&k in remote.data)rawSet(k,remote.data[k]);});

function syncPull(){
  if(syncBusy)return;syncBusy=true;syncLastPull=Date.now();
  syncFetch('/api/progress',{cache:'no-store'},8000).then(function(r){
    if(!r.ok)throw new Error('http');return r.json();
  }).then(function(remote){
    syncBusy=false;syncReady=true;
    if(!remote||typeof remote.ts!=='number'){setSync('off');return;}
    var lts=store.get('arch.ts',0),rHas=hasProg(remote.data),lHas=hasProg(syncSnapshot());
    if(!lHas&&rHas){syncApply(remote);setSync('ok');}
    else if(lHas&&!rHas){rawSet('arch.ts',Date.now());syncPush(false);}
    else if(remote.ts>lts){syncApply(remote);setSync('ok');}
    else if(lts>remote.ts){syncPush(false);}
    else setSync('ok');
  }).catch(function(){syncBusy=false;syncReady=true;setSync('off');});
}

/* ---------- Mixed round ---------- */
function buildExam(){
  var pool=[];
  MODS.forEach(function(m){m.quiz.forEach(function(x,i){pool.push({k:m.id+':'+i,m:m,x:x,scen:/^Situation: /.test(x.q)});});});
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var cnt={},out=[];
  pool.forEach(function(it){if(out.length>=12)return;if(!it.scen)return;cnt[it.m.id]=(cnt[it.m.id]||0);if(cnt[it.m.id]>=2)return;cnt[it.m.id]++;out.push(it);});
  exam.items=out;exam.ans={};
}
function examGetA(key){return exam.ans[key.slice(2)];}
function renderExamBody(){
  var root=$('#examroot');if(!root)return;
  var items=exam.items,answered=0,correct=0,missed={};
  items.forEach(function(it){var a=exam.ans[it.k];if(a!==undefined){answered++;if(a===it.x.a)correct++;else missed[it.m.id]=it.m;}});
  var fin=answered===items.length,review='';
  if(fin){var ms=Object.keys(missed);review=ms.length?'<p class="readout">Review these modules: '+ms.map(function(id){return '<a href="#'+id+'" data-go="'+id+'">Module '+missed[id].n+' '+esc(missed[id].title)+'</a>'}).join(', ')+'.</p>':'<p class="readout good">No misses. Try another round.</p>';}
  root.innerHTML='<div class="qsum"><strong>'+(fin?'Round score: '+correct+' of '+items.length:'Answered '+answered+' of '+items.length)+'</strong><button class="btn ghost" data-newround>New round</button></div>'+review+
  items.map(function(it,i){return qCardHTML('x|'+it.k,it.x,examGetA,i+1)}).join('');
}
function renderExam(){
  if(!exam.items)buildExam();

function answerQ(key,j){
  if(key.indexOf('x|')===0){var k=key.slice(2);if(exam.ans[k]!==undefined)return;exam.ans[k]=j;renderExamBody();return;}

/* ---------- Drills ---------- */
function dstateOf(d){var s=DS[d.id];if(!s){s=DS[d.id]={text:''};dreset(d,s);}return s;}
function dreset(d,s){
  s.hint=false;s.sol=false;s.fb='';s.ok=null;s.val='';s.checked=false;s.picks={};s.shown=false;s.rub={};
  if(d.type==='num')s.inst=d.gen(R);

}
function dbadge(d){return d.type==='num'?'Calculate':(d.type==='pick'?'Tick the right ones':'Written case');}
function drawDrill(d){

  if(d.type==='num'){

    h+='<p class="dq">'+esc(inst.q)+'</p><div class="row"><label class="field"><span>Your answer'+(inst.unit?' ('+esc(inst.unit)+')':'')+'</span><input type="text" inputmode="decimal" autocomplete="off" id="dv-'+d.id+'" data-dv="'+d.id+'" value="'+esc(s.val)+'"></label>'+
    '<button class="btn" data-d="check" data-id="'+d.id+'">Check</button><button class="btn ghost" data-d="hint" data-id="'+d.id+'">Hint</button><button class="btn ghost" data-d="sol" data-id="'+d.id+'">Worked solution</button><button class="btn ghost" data-d="new" data-id="'+d.id+'">New numbers</button></div>';
    if(s.fb)h+='<p class="fb '+(s.ok?'good':'bad')+'">'+esc(s.fb)+'</p>';
    if(s.hint)h+='<p class="hintbox"><strong>Hint.</strong> '+esc(inst.hint)+'</p>';
    if(s.sol)h+='<div class="result"><p><strong>Answer: '+fa(inst.ans)+(inst.unit?' '+esc(inst.unit):'')+'</strong></p><p>'+esc(inst.sol)+'</p></div>';
  } else if(d.type==='pick'){
    h+='<p class="dq">'+esc(d.q)+'</p><div class="pickgrid">'+s.order.map(function(i){
      var it=d.items[i],on=!!s.picks[i],cls='chk';if(s.checked)cls+=(on===it.c)?' right':' wrong';
      return '<label class="'+cls+'" for="pk-'+d.id+'-'+i+'"><input type="checkbox" id="pk-'+d.id+'-'+i+'" data-pk="'+d.id+'" data-i="'+i+'"'+(on?' checked':'')+(s.checked?' disabled':'')+'><span>'+esc(it.t)+'</span></label>';
    }).join('')+'</div><div class="row">'+(s.checked?'<button class="btn" data-d="new" data-id="'+d.id+'">Try again</button>':'<button class="btn" data-d="check" data-id="'+d.id+'">Check</button>')+'</div>';
    if(s.checked){h+='<p class="fb '+(s.ok?'good':'warn')+'">'+esc(s.fb)+'</p><div class="result"><p><strong>Why, item by item</strong></p><ul class="deeplist">'+s.order.map(function(i){var it=d.items[i],on=!!s.picks[i];return '<li><strong>'+esc(it.t)+'</strong>: '+(on===it.c?'Right. ':'Not quite. ')+esc(it.w)+'</li>';}).join('')+'</ul></div>';}
  } else {
    var n=0;d.rubric.forEach(function(_,i){if(s.rub[i])n++;});
    h+='<p class="dq">'+esc(d.q)+'</p><label class="field" style="width:100%"><span>Write your answer first, then compare with the model answer</span><textarea id="dt-'+d.id+'" data-dt="'+d.id+'" rows="5">'+esc(s.text||'')+'</textarea></label><div class="row" style="margin-top:10px"><button class="btn" data-d="reveal" data-id="'+d.id+'">'+(s.shown?'Hide model answer':'Show model answer')+'</button></div>';
    if(s.shown)h+='<div class="result"><p><strong>Model answer</strong></p><p>'+esc(d.model)+'</p><p><strong>Self-check: did your answer cover these?</strong></p>'+d.rubric.map(function(r,i){return '<label class="chk" for="dr-'+d.id+'-'+i+'" style="margin-bottom:6px"><input type="checkbox" id="dr-'+d.id+'-'+i+'" data-rb="'+d.id+'" data-i="'+i+'"'+(s.rub[i]?' checked':'')+'><span>'+esc(r)+'</span></label>'}).join('')+'<p class="readout">Covered '+n+' of '+d.rubric.length+'. '+(n===d.rubric.length?'Strong answer.':(n>=d.rubric.length-1?'Close. Add the missing point and try phrasing it aloud.':'Rewrite your answer with the points you missed.'))+'</p></div>';
  }
  el.innerHTML=h;

}
function reserveQ(d,el,oldh){
  var nq=el.querySelector('.dq');if(!nq)return;
  if(d.type==='num'){
    if(!nq.offsetHeight&&!oldh)return;
    var mx=oldh||0;
    try{
      nq.style.minHeight='0px';
      var probe=nq.cloneNode(false);probe.style.cssText='position:absolute;visibility:hidden;left:0;right:0;min-height:0;margin:0';
      nq.parentNode.insertBefore(probe,nq);
      mx=Math.max(mx,nq.offsetHeight);
      for(var k=0;k<14;k++){probe.textContent=d.gen(R).q;mx=Math.max(mx,probe.offsetHeight);}
      nq.parentNode.removeChild(probe);
    }catch(e){}
    if(mx)nq.style.minHeight=mx+'px';
  }else if(oldh){nq.style.minHeight=oldh+'px';}
}
function reserveAllQ(){
  var m=modById(cur);if(!m||!m.drills)return;
  m.drills.forEach(function(d){var el=document.getElementById('drill-'+d.id);if(el)reserveQ(d,el,0);});
}
function bump(d,ok){
  var st=drillStats[d.id]||{ok:0,tries:0};st.tries++;if(ok)st.ok++;drillStats[d.id]=st;store.set('arch.drill',drillStats);
  renderRail();updateDrillSummary();
}
function updateDrillSummary(){
  var m=modById(cur);if(!m)return;var el=$('#drillsum');if(!el)return;
  var n=m.drills.filter(drillDone).length;
  el.textContent=n+' of '+m.drills.length+' drills done in this module.';
}
function parseNum(v){var t=String(v).replace(/[,\s₹$%]/g,'');return t===''?NaN:parseFloat(t);}
function numOk(inst,x){
  if(isNaN(x))return false;var a=inst.ans;
  if(inst.abs)return Math.abs(x-a)<=inst.abs;
  if(!inst.tol)return Math.abs(x-a)<0.0001;
  return Math.abs(x-a)<=inst.tol*Math.max(Math.abs(a),1);
}
function drillAction(act,id){
  var d=DMAP[id];if(!d)return;var s=dstateOf(d);
  if(act==='check'){
    if(d.type==='num'){
      var x=parseNum(s.val);
      if(isNaN(x)){s.fb='Enter a number first.';s.ok=false;}
      else if(numOk(s.inst,x)){s.ok=true;s.fb='Correct. '+fa(s.inst.ans)+(s.inst.unit?' '+s.inst.unit:'')+'. Press New numbers to practise with fresh values.';bump(d,true);}
      else{s.ok=false;s.fb='Not quite. Try the hint, then check your arithmetic and units.';bump(d,false);}
    } else if(d.type==='pick'){
      var good=0;d.items.forEach(function(it,i){if(!!s.picks[i]===it.c)good++;});
      s.checked=true;s.ok=good===d.items.length;s.fb=s.ok?'All '+good+' correct.':good+' of '+d.items.length+' correct. Read the reasons above, then try again.';
      bump(d,s.ok);
    }
  } else if(act==='hint'){s.hint=!s.hint;}
  else if(act==='sol'){s.sol=!s.sol;}
  else if(act==='new'){var t=s.text;dreset(d,s);s.text=t;}
  else if(act==='reveal'){s.shown=!s.shown;if(s.shown&&!s.counted){s.counted=true;bump(d,false);}}
  drawDrill(d);
}

  var root=$('#drillroot');if(!root)return;
  root.innerHTML=m.drills.map(function(d){return '<div class="drill" id="drill-'+d.id+'"></div>'}).join('');
  m.drills.forEach(drawDrill);updateDrillSummary();
}
