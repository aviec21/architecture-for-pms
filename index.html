<script>
/* Drill types:
   num  : gen(R) returns {q, ans, unit, tol (relative, 0 means exact), abs (absolute), hint, sol}
   pick : q, items [{t, c (true if should be ticked), w (why)}]
   case : q, model (model answer), rubric [points to self-check]
   R helpers: R.int(a,b,step), R.pick(arr), R.f(n,d), R.r(n,d) */
window.XD = {
m0:[
{id:"m0-cap",type:"num",title:"Size the servers",gen:function(R){
  var U=R.pick([500000,800000,1200000,2000000,3000000]),p=R.pick([1,2,3,5]),per=R.pick([50,80,100,125,200]);
  var rps=U*p/100/60,ans=Math.ceil(rps/per);
  return {q:"An app has "+R.f(U)+" registered users. In its busiest minute "+p+"% of them each send one request, spread evenly across that minute. One server handles "+per+" requests per second. What is the minimum number of servers, with no safety margin?",ans:ans,unit:"servers",tol:0,
  hint:"Convert users in the peak minute to requests per second, then divide by what one server handles and round up.",
  sol:R.f(U)+" x "+p+"% = "+R.f(U*p/100)+" requests in one minute, which is "+R.f(rps,1)+" per second. Divided by "+per+" gives "+R.f(rps/per,2)+", rounded up to "+ans+". A real plan adds headroom and a spare for failure."};
}},
{id:"m0-down",type:"num",title:"Turn an uptime promise into minutes",gen:function(R){
  var a=R.pick([99,99.5,99.9,99.95,99.99]),ans=R.r((100-a)/100*525600,1);
  return {q:"A contract promises "+a+"% availability. How many minutes of downtime per year does that allow? (A year has 525,600 minutes.)",ans:ans,unit:"minutes",tol:0.03,
  hint:"Downtime share = 100% minus the availability.",
  sol:"(100 - "+a+")% of 525,600 = "+R.f(ans,1)+" minutes, about "+R.f(ans/60,1)+" hours."};
}},
{id:"m0-lat",type:"num",title:"Find the latency overshoot",gen:function(R){
  var h=[R.int(20,60,10),R.int(10,40,10),R.int(30,90,10),R.int(60,140,10),R.int(80,200,10)],s=h.reduce(function(a,b){return a+b},0),over=R.int(30,120,10),b=s-over;
  return {q:"A payment passes through five hops that take "+h.join(", ")+" milliseconds. The target is "+b+" ms in total. By how many milliseconds is the path over the target?",ans:over,unit:"ms",tol:0,
  hint:"Add the hops, then subtract the target.",sol:"Total = "+s+" ms. Target = "+b+" ms. Over by "+over+" ms. The biggest hop is usually the first one to question."};
}},
{id:"m0-case",type:"case",title:"Case: the 99.99% promise",
 q:"The VP of Sales wants to promise 99.99% availability to a large customer for a service that today runs at about 99.9%. Write the questions and the position you would take in the review.",
 model:"99.99% allows about 53 minutes of downtime a year versus about 8.8 hours at 99.9%, so it is ten times tighter. I would ask: which user journeys does the promise cover and how is it measured; what is the current measured availability; which components are single points of failure (database, partner APIs, DNS); what redundancy across zones or regions is needed and what it costs; how fast can we detect and roll back; and what is the penalty if we miss it. Because an external partner outside our control may cap us below 99.99%, I would propose either a looser SLA with a tighter internal SLO, or a funded reliability plan with dates before agreeing.",
 rubric:["Converted the percentage into minutes of downtime","Asked how availability is measured and for which journeys","Named single points of failure and partner dependencies","Linked the target to cost and redundancy","Separated the SLA promise from the internal SLO"]}
],
m1:[
{id:"m1-dl",type:"num",title:"How long does the page take to download?",gen:function(R){
  var mb=R.pick([1.5,2,3,4,5,6]),mbps=R.pick([1,2,3,4,5]),ans=R.r(mb*8/mbps,1);
  return {q:"A mobile page weighs "+mb+" MB in total. The user's connection delivers "+mbps+" Mbps. Ignoring delays and processing, how many seconds does the download take?",ans:ans,unit:"seconds",tol:0.03,
  hint:"1 byte is 8 bits, and Mbps means megabits per second.",sol:mb+" MB x 8 = "+(mb*8)+" megabits. Divided by "+mbps+" Mbps = "+R.f(ans,1)+" seconds. Cutting page weight is often the cheapest speed win for users on slow networks."};
}},
{id:"m1-ab",type:"num",title:"How many users does an A/B test need?",gen:function(R){
  var p=R.pick([5,8,10,12,15,20]),d=R.pick([1,1.5,2,2.5]),pp=p/100,dd=d/100,ans=Math.round(16*pp*(1-pp)/(dd*dd));
  return {q:"Your current conversion rate is "+p+"%. You want to detect an improvement of "+d+" percentage points. Using the rule of thumb n = 16 x p x (1 - p) / d squared (about 80% power and 5% significance), how many users does each variant need?",ans:ans,unit:"users per variant",tol:0.06,
  hint:"Use p and d as fractions, so 10% is 0.10 and 1 point is 0.01.",sol:"n = 16 x "+pp+" x "+R.f(1-pp,2)+" / ("+dd+" squared) = "+R.f(ans)+" per variant. Smaller lifts need far more users, which is why tiny tests on small traffic mislead."};
}},
{id:"m1-pick",type:"pick",title:"What must the server enforce?",
 q:"Tick every item where trusting the app alone would be a money or security risk (the server must also enforce it).",
 items:[{t:"The loan amount is within the user's approved limit",c:true,w:"Money rule. A modified app could send any amount."},{t:"A user can only view their own statements",c:true,w:"Access control must be checked on every request."},{t:"A discount code is valid and applied once",c:true,w:"Pricing rules belong on the server."},{t:"The button colour matches the brand",c:false,w:"Cosmetic only."},{t:"A loading animation plays while data fetches",c:false,w:"Experience only."},{t:"Placeholder hint text in a form field",c:false,w:"Helps users, carries no risk."}]},
{id:"m1-case",type:"case",title:"Case: choose the platform",
 q:"You are launching a small-ticket loan app for first-time borrowers in smaller Indian towns. Many have 2 GB phones and unreliable 4G. The product needs OTP auto-read, selfie capture and background reminders. Recommend a platform and a rendering approach, and say what you would test first.",
 model:"Selfie capture, OTP auto-read and reminders need device features, so a pure web app or PWA is risky. A slim cross-platform or native Android app is the likely choice, because Android dominates this segment. I would keep the install small (a target such as under 25 MB), lazy-load heavy screens, and compress images. The rendering question is mostly CSR behind login, with SSR or static pages only for public marketing pages that need to rank. First I would test install and completion rates against a lighter flow, measure LCP and INP on a real mid-range phone over throttled 4G, and keep a feature flag for staged rollout. I would also confirm the backend supports older app versions.",
 rubric:["Matched required device features to the platform choice","Considered app size and low-end devices","Separated public pages (SEO) from logged-in screens","Named performance targets and a real-device test","Mentioned staged rollout and backward compatibility"]}
],
m2:[
{id:"m2-backlog",type:"num",title:"How long to clear the backlog?",gen:function(R){
  var r=R.pick([100,200,300]),k=R.pick([1.5,2,3]),c=r*k,T=R.pick([20,30,40,60,90]),ans=R.r(T*r/(c-r),1);
  return {q:"A partner bank is down for "+T+" minutes while your queue keeps receiving "+r+" payments per minute. When the bank returns it can process "+c+" payments per minute in total (including new arrivals). How many minutes does it take to clear the backlog?",ans:ans,unit:"minutes",tol:0.03,
  hint:"Backlog = down time x arrival rate. Extra capacity = processing rate minus arrival rate.",sol:"Backlog = "+T+" x "+r+" = "+R.f(T*r)+" payments. Spare capacity = "+c+" - "+r+" = "+(c-r)+" per minute. Time = "+R.f(T*r)+" / "+(c-r)+" = "+R.f(ans,1)+" minutes. If spare capacity is small, recovery takes very long."};
}},
{id:"m2-backoff",type:"num",title:"Exponential backoff",gen:function(R){
  var d=R.pick([1,2,3]),n=R.pick([4,5,6]),ans=d*(Math.pow(2,n)-1);
  return {q:"A client retries a failed call. The first retry waits "+d+" second(s), and each following wait doubles. After "+n+" retries, how many seconds have been spent waiting in total?",ans:ans,unit:"seconds",tol:0,
  hint:"List the waits and add them: d, 2d, 4d, and so on.",sol:"Waits are "+Array.apply(null,Array(n)).map(function(_,i){return d*Math.pow(2,i)}).join(" + ")+" = "+ans+" seconds. Waiting longer each time gives a struggling partner room to recover."};
}},
{id:"m2-pick",type:"pick",title:"Safe to retry?",
 q:"Tick the operations that are naturally safe to repeat without an idempotency key.",
 items:[{t:"Read the account balance",c:true,w:"Reading changes nothing."},{t:"Set the profile name to “Riya”",c:true,w:"Doing it twice gives the same result."},{t:"Cancel order 991",c:true,w:"Cancelling an already cancelled order leaves the same state."},{t:"Add ₹500 to a wallet",c:false,w:"Each repeat adds again. Needs an idempotency key."},{t:"Create a new order",c:false,w:"A repeat creates a duplicate."},{t:"Send an SMS",c:false,w:"A repeat sends another message."}]},
{id:"m2-case",type:"case",title:"Case: the double debit",
 q:"Support reports that a few customers were debited twice for one payment after a slow-network night. Describe the likely cause, the immediate fix, and the long-term design changes.",
 model:"Likely cause: the app timed out, retried automatically, and the payment service had no way to recognise the retry as the same request, so it processed it twice. Immediate fix: identify the duplicate debits from logs, refund them, and communicate with affected customers. Long-term: the client generates a unique idempotency key per payment attempt and sends it with every retry; the server stores the key and result and returns the saved result for repeats; show a pending state rather than an error on timeout; add status checks to the partner and a nightly reconciliation job; add monitoring and an alert for duplicate payment references.",
 rubric:["Identified retry without idempotency as the cause","Described refund and customer communication","Proposed idempotency keys stored server-side","Proposed pending state and status check, not blind retry","Added reconciliation and monitoring"]}
],
m3:[
{id:"m3-size",type:"num",title:"How big is the table?",gen:function(R){
  var N=R.pick([5,10,20,50]),B=R.pick([200,400,800]),ans=R.r(N*1e6*B*1.4/1e9,1);
  return {q:"An orders table will hold "+N+" million rows of about "+B+" bytes each. Indexes and overhead add about 40%. How many gigabytes will it use? (1 GB = 1,000,000,000 bytes.)",ans:ans,unit:"GB",tol:0.03,
  hint:"Rows x bytes per row x 1.4, then convert to gigabytes.",sol:N+",000,000 x "+B+" x 1.4 = "+R.f(N*1e6*B*1.4)+" bytes = "+R.f(ans,1)+" GB. Doing this simple arithmetic early shows whether you need sharding or a bigger plan."};
}},
{id:"m3-replica",type:"num",title:"How many database nodes for reads?",gen:function(R){
  var rd=R.pick([4000,6000,9000,12000]),h=R.pick([1500,2000,2500]),ans=Math.ceil(rd/h);
  return {q:"Your app sees "+R.f(rd)+" read queries per second at peak. One database node can serve "+R.f(h)+" reads per second. If the primary and its read replicas all serve reads, how many nodes (primary included) do you need at minimum?",ans:ans,unit:"nodes",tol:0,
  hint:"Divide the load by what one node handles and round up.",sol:R.f(rd)+" / "+R.f(h)+" = "+R.f(rd/h,2)+", rounded up to "+ans+". Replicas can lag a little, so check that stale reads are acceptable for each screen."};
}},
{id:"m3-pick",type:"pick",title:"What belongs in the relational database?",
 q:"Tick the data that belongs in a relational database with transactions.",
 items:[{t:"Ledger entries for money movement",c:true,w:"Needs all-or-nothing updates and strong consistency."},{t:"Orders and their payment status",c:true,w:"Related records that must stay consistent."},{t:"Profile photos and KYC scans",c:false,w:"Large files fit object storage; keep only a reference in the database."},{t:"Short-lived login sessions and OTPs",c:false,w:"A cache with expiry suits this."},{t:"A full-text product search index",c:false,w:"A search engine suits ranking and typo tolerance."},{t:"Three years of aggregated monthly analytics",c:false,w:"A data warehouse suits large analytical queries."}]},
{id:"m3-case",type:"case",title:"Case: plan the wallet feature's data",
 q:"You are adding a wallet to a shopping app: users add money, spend it on orders, and see a history. List where each kind of data should live, what consistency you need for each, and one risk to ask engineering about.",
 model:"Balances and ledger entries go in the relational database, written inside a transaction so a debit and the order update succeed or fail together; strong consistency is required, and I would store every change as an entry rather than editing a balance in place for auditability. The history screen can read from a replica if a few seconds of lag is acceptable, but the balance shown at checkout must come from the primary. Session data and the top-of-page widgets can sit in a cache. Receipts and statements as PDFs go in object storage with a reference in the database. Analytics goes to the warehouse. Risks to ask about: idempotency of add-money and spend calls, concurrent spends from two devices, and the reconciliation with the payment partner.",
 rubric:["Put the ledger in a transactional relational store","Distinguished which screens need exact versus slightly stale data","Used cache, object storage and warehouse for suitable data","Raised idempotency or concurrent spend","Mentioned reconciliation with the payment partner"]}
],
m4:[
{id:"m4-chain",type:"num",title:"Availability of the whole path",gen:function(R){
  var o=[99.9,99.95,99.99,99.5],a=[R.pick(o),R.pick(o),R.pick(o)],p=a[0]*a[1]*a[2]/10000,ans=R.r(p,3);
  return {q:"A request needs three components in a row, with availabilities of "+a.join("%, ")+"%. What is the availability of the whole path, in percent?",ans:ans,unit:"%",abs:0.02,tol:0,
  hint:"Multiply the three availabilities (as fractions).",sol:"Multiply: "+a.map(function(x){return x/100}).join(" x ")+" = "+R.f(ans,3)+"%. The chain is always weaker than its weakest part."};
}},
{id:"m4-budget",type:"num",title:"Error budget left",gen:function(R){
  var slo=R.pick([99.5,99.9,99.95]),allowed=(100-slo)/100*43200,used=Math.round(allowed*R.pick([0.25,0.5,0.75])),ans=R.r(allowed-used,1);
  return {q:"Your SLO is "+slo+"% for a 30-day month (43,200 minutes). You have already had "+used+" minutes of downtime. How many minutes of downtime remain in the error budget?",ans:ans,unit:"minutes",tol:0.03,
  hint:"First find the allowed minutes, then subtract the downtime used.",sol:"Allowed = (100 - "+slo+")% x 43,200 = "+R.f(allowed,1)+" minutes. Remaining = "+R.f(allowed,1)+" - "+used+" = "+R.f(ans,1)+" minutes."};
}},
{id:"m4-cost",type:"num",title:"Cloud cost per active user",gen:function(R){
  var bill=R.pick([300000,450000,600000,900000]),mau=R.pick([30000,50000,75000,100000]),ans=R.r(bill/mau,2);
  return {q:"Your monthly cloud bill is ₹"+R.f(bill)+" and you have "+R.f(mau)+" monthly active users. What is the cloud cost per active user, in rupees?",ans:ans,unit:"₹ per user",tol:0.02,
  hint:"Divide the bill by active users.",sol:"₹"+R.f(bill)+" / "+R.f(mau)+" = ₹"+R.f(ans,2)+". Track this over time; if it rises faster than revenue per user, ask why."};
}},
{id:"m4-case",type:"case",title:"Case: launch readiness for checkout",
 q:"You are about to release a rebuilt checkout to all users on Friday evening. Write the questions you would ask in the readiness review and the release plan you would insist on.",
 model:"Questions: what are the SLOs for payment success and latency, and how much error budget is left this month; what load testing was done at the expected peak plus 2x; how is business success monitored, not just server health; who is on call; how long does rollback take and when was it last rehearsed; are there any single points of failure or partner limits; what changes in data or schema are not reversible. Plan: do not release on Friday evening; use a feature flag and a canary at 1%, then 10%, then 50%, with clear stop thresholds on payment success rate and errors, an owner watching, a documented rollback, and customer support briefed.",
 rubric:["Asked about SLOs and remaining error budget","Asked about load testing and business-level monitoring","Required a fast, rehearsed rollback","Chose a staged release (flag or canary) with stop thresholds","Considered timing, on-call and support readiness"]}
],
m5:[
{id:"m5-otp",type:"num",title:"How long to guess a 6-digit code?",gen:function(R){
  var k=R.pick([3,5,10]),w=R.pick([5,10,15,30]),ans=R.r((1e6/k)*w/1440,1);
  return {q:"A 6-digit code has 1,000,000 possibilities. The system allows only "+k+" attempts per "+w+" minutes per account. Ignoring code expiry, how many days would it take to try every possibility in the worst case?",ans:ans,unit:"days",tol:0.03,
  hint:"Number of windows = 1,000,000 / attempts per window. Convert minutes to days (1,440 minutes per day).",sol:"Windows = 1,000,000 / "+k+" = "+R.f(1e6/k)+". Time = "+R.f(1e6/k)+" x "+w+" min = "+R.f((1e6/k)*w)+" min = "+R.f(ans,1)+" days. Rate limits turn an easy attack into an impractical one."};
}},
{id:"m5-pick-authz",type:"pick",title:"Authorization failures",
 q:"Tick the items that are AUTHORIZATION failures (identity is known, but permission is wrong).",
 items:[{t:"A logged-in customer opens another customer's statement by changing an ID",c:true,w:"The server did not check ownership."},{t:"A support agent can approve loans when they should only view",c:true,w:"Role permissions are too wide."},{t:"A non-admin calls an admin-only API directly",c:true,w:"The API did not check the role."},{t:"Someone logs in with a stolen password and no second factor",c:false,w:"This is an authentication weakness."},{t:"The password policy allows 123456",c:false,w:"Authentication strength."},{t:"A session token never expires",c:false,w:"Session management, part of authentication."}]},
{id:"m5-pick-pii",type:"pick",title:"What counts as personal data?",
 q:"Tick everything that is personally identifiable information (PII).",
 items:[{t:"Aadhaar number",c:true,w:"A government identifier."},{t:"Selfie photo",c:true,w:"Identifies a person."},{t:"IP address linked to an account",c:true,w:"Linked to a person, so personal data."},{t:"Full name",c:true,w:"Identifies a person alone or with other data."},{t:"Total orders per city (aggregate)",c:false,w:"Aggregated and not tied to a person."},{t:"Server CPU usage",c:false,w:"Technical metric."}]},
{id:"m5-case",type:"case",title:"Case: threat-model “share my statement”",
 q:"A new feature lets users share a link to their loan statement with a third party, such as a landlord. Threat-model it with STRIDE and list the controls and the data decisions you would require.",
 model:"Spoofing: someone pretends to be the owner or the recipient; use signed, unguessable links tied to the user and require login to create them. Tampering: users editing amounts in a shared page; render from server data only. Repudiation: dispute over who shared what; log creation, access and revocation. Information disclosure: link forwarded or guessed; make links expire (for example 24 hours), allow revoke, mask sensitive fields (partial account number), rate-limit and watch for scraping. Denial of service: link endpoint flooded; use rate limiting and a WAF. Elevation of privilege: link grants more than the statement; scope the token to one document. Data decisions: share only what is needed, no PAN or full address, consent shown in the UI, retention defined, and check DPDP Act duties.",
 rubric:["Covered several STRIDE letters with concrete threats","Proposed unguessable, expiring, revocable links","Limited what data is shown (minimisation, masking)","Added logging for audit","Mentioned consent or privacy law duties"]}
],
m6:[
{id:"m6-pr",type:"num",title:"Precision or recall?",gen:function(R){
  var tp=R.int(40,120,10),fn=R.int(20,100,10),fp=R.int(10,60,10),m=R.pick(["precision","recall"]),ans=m==="precision"?R.r(100*tp/(tp+fp),1):R.r(100*tp/(tp+fn),1);
  return {q:"A fraud model caught "+tp+" real frauds, missed "+fn+" real frauds, and wrongly flagged "+fp+" good transactions. What is its "+m+", in percent?",ans:ans,unit:"%",tol:0.02,
  hint:"Precision = caught / (caught + wrongly flagged). Recall = caught / (caught + missed).",sol:m==="precision"?"Precision = "+tp+" / ("+tp+" + "+fp+") = "+R.f(ans,1)+"%.":"Recall = "+tp+" / ("+tp+" + "+fn+") = "+R.f(ans,1)+"%."};
}},
{id:"m6-cost",type:"num",title:"What do the mistakes cost?",gen:function(R){
  var fn=R.int(10,60,10),fp=R.int(50,300,50),cfn=R.pick([2000,5000]),cfp=R.pick([100,300]),ans=fn*cfn+fp*cfp;
  return {q:"Over a week the model missed "+fn+" frauds (each costs ₹"+R.f(cfn)+") and wrongly blocked "+fp+" good customers (each costs ₹"+R.f(cfp)+"). What is the total cost of its mistakes in rupees?",ans:ans,unit:"₹",tol:0,
  hint:"Multiply each kind of mistake by its cost and add.",sol:fn+" x "+R.f(cfn)+" + "+fp+" x "+R.f(cfp)+" = ₹"+R.f(ans)+". Compare thresholds by this total, not by accuracy alone."};
}},
{id:"m6-pick",type:"pick",title:"Classic ML or LLM?",
 q:"Tick the tasks where classic machine learning is the better first choice.",
 items:[{t:"Credit score from structured bureau data",c:true,w:"Tabular data, cheap, explainable."},{t:"Scoring each card swipe for fraud in milliseconds",c:true,w:"Needs speed and low cost per prediction."},{t:"Weekly demand forecast from sales history",c:true,w:"Numeric time-series is a classic ML strength."},{t:"Summarising a 40-page contract",c:false,w:"Long text; a language model fits."},{t:"Answering free-form questions from help articles",c:false,w:"Language task; LLM with RAG fits."},{t:"Drafting an apology message",c:false,w:"Language generation."}]},
{id:"m6-case",type:"case",title:"Case: the credit model is drifting",
 q:"Default rates among newly approved loans have risen for three months while the model's approval rate stayed the same. Describe how you would investigate and what you would change.",
 model:"First confirm it is a real shift, not noise: compare default rates by approval score band and by cohort. Check input drift: have the distributions of key features (income, bureau score, loan size, channel) changed versus training? Look for a new customer segment or channel, a policy change, or macro changes such as rate rises. Check data quality problems in the pipeline and any leakage assumptions. Short term: tighten cut-offs or add rules for the affected segment, increase monitoring. Medium term: retrain on recent data with proper time-based validation, compare with the current model on a holdout, and roll out gradually. Process: add drift and performance dashboards with alert thresholds, and keep explanations ready for regulators.",
 rubric:["Checked performance by cohort and score band","Looked for input drift and data issues","Considered segment, policy or macro changes","Proposed short-term controls and retraining with a safe rollout","Added ongoing monitoring"]}
],
m7:[
{id:"m7-cost",type:"num",title:"Monthly model cost",gen:function(R){
  var reqs=R.pick([20000,50000,100000,200000]),tin=R.pick([500,1000,1500,2000,3000]),tout=R.pick([100,200,300,500]),pin=R.pick([1,3,5]),pout=R.pick([5,15,20]),ans=reqs*30*(tin*pin+tout*pout)/1e6;
  return {q:"A feature makes "+R.f(reqs)+" model calls a day. Each call has "+R.f(tin)+" input tokens and "+tout+" output tokens. Pricing is $"+pin+" per million input tokens and $"+pout+" per million output tokens. What is the cost for a 30-day month, in dollars?",ans:ans,unit:"$",tol:0.02,
  hint:"Cost per call = input tokens x input price + output tokens x output price (both per million).",sol:"Per call = ("+R.f(tin)+" x $"+pin+" + "+tout+" x $"+pout+") / 1,000,000 = $"+R.f((tin*pin+tout*pout)/1e6,5)+". Times "+R.f(reqs)+" x 30 = $"+R.f(ans,0)+"."};
}},
{id:"m7-ctx",type:"num",title:"How many chunks fit in the context?",gen:function(R){
  var W=R.pick([8000,16000,32000]),S=R.pick([500,800,1000]),q=R.pick([100,200,300]),o=R.pick([500,800,1000]),c=R.pick([400,500,600,800]),ans=Math.floor((W-S-q-o)/c);
  return {q:"A model has a "+R.f(W)+"-token context window. Your system prompt uses "+S+" tokens, the user's question "+q+", and you reserve "+o+" tokens for the answer. Each retrieved document chunk is "+c+" tokens. What is the maximum number of whole chunks you can include?",ans:ans,unit:"chunks",tol:0,
  hint:"Subtract everything else from the window, then divide by the chunk size and round down.",sol:"Free space = "+R.f(W)+" - "+S+" - "+q+" - "+o+" = "+R.f(W-S-q-o)+" tokens. Divided by "+c+" = "+R.f((W-S-q-o)/c,2)+", rounded down to "+ans+" chunks."};
}},
{id:"m7-route",type:"num",title:"What does routing save?",gen:function(R){
  var L=R.pick([0.012,0.02,0.03]),S=R.pick([0.0006,0.001,0.0015]),sh=R.pick([50,60,70,80,90]),ans=R.r(sh*(1-S/L),1);
  return {q:"A large model costs $"+L+" per request and a small model $"+S+". You route "+sh+"% of requests to the small model and the rest to the large one. By what percentage does the average cost per request fall compared with using only the large model?",ans:ans,unit:"%",tol:0.03,
  hint:"New average = share_small x S + (1 - share_small) x L. Compare with L.",sol:"New average = "+(sh/100)+" x "+S+" + "+R.f(1-sh/100,2)+" x "+L+" = $"+R.f(sh/100*S+(1-sh/100)*L,5)+". Saving = 1 - that / "+L+" = "+R.f(ans,1)+"%, as long as the small model meets the quality bar on those requests."};
}},
{id:"m7-pick",type:"pick",title:"Where is RAG the right first tool?",
 q:"Tick the problems where RAG (retrieval) is the right first tool.",
 items:[{t:"Answers must reflect the latest policy document",c:true,w:"Retrieval reads the current document at answer time."},{t:"Facts change every week",c:true,w:"No retraining needed."},{t:"Answer from private documents the model never saw",c:true,w:"Retrieve them and supply them in the prompt."},{t:"Teach the model your brand voice",c:false,w:"Prompting, then fine-tuning if needed."},{t:"Cut cost of a simple classification at huge volume",c:false,w:"A small or fine-tuned model."},{t:"Force a strict output format on millions of calls",c:false,w:"Clear prompts, structured output, or fine-tuning."}]},
{id:"m7-case",type:"case",title:"Case: build the eval set for a support bot",
 q:"Your team is about to launch a support assistant that answers from the help centre. Describe how you would build an eval set, what you would measure, and the launch gate.",
 model:"Collect real questions from tickets and chat logs, covering common topics, rare ones, ambiguous questions, out-of-scope questions, adversarial prompts and non-English or mixed-language messages; aim for a few hundred to start. For each, write the approved answer or the source article, and what a good refusal or hand-off looks like. Measure correctness against sources, whether the answer cites the right article, harmful or non-compliant answers, refusal and hand-off behaviour, latency including time to first token, and cost per answer. Review disagreements by hand to calibrate any automated grader. Launch gate: for example at least 90% correct on core topics, zero severe policy violations in the safety set, hand-off works, and cost within budget. Run the set before every prompt or model change and after launch on sampled live traffic.",
 rubric:["Used real questions, including hard and out-of-scope cases","Defined correctness against sources and cited articles","Included safety and policy tests","Measured latency and cost as well as quality","Set a clear launch gate and re-ran the set on every change"]}
],
m8:[
{id:"m8-compound",type:"num",title:"How reliable is the whole chain?",gen:function(R){
  var n=R.int(4,12,1),p=R.pick([90,95,97,99]),ans=R.r(100*Math.pow(p/100,n),1);
  return {q:"An agent task has "+n+" steps in a row, each correct "+p+"% of the time, with no checks between steps. What percentage of runs finish with every step correct?",ans:ans,unit:"%",tol:0.03,
  hint:"Multiply the success rate by itself once per step.",sol:(p/100)+" to the power "+n+" = "+R.f(ans/100,3)+", or "+R.f(ans,1)+"%. Shorter chains and checks between steps improve this fast."};
}},
{id:"m8-context",type:"num",title:"Why long loops get expensive",gen:function(R){
  var t=R.pick([500,1000,1500,2000]),n=R.int(5,12,1),ans=t*n*(n+1)/2;
  return {q:"Each step of an agent adds "+R.f(t)+" tokens to the conversation, and the whole conversation is sent to the model again at every step. Counting only input tokens, how many are sent in total across "+n+" steps? (Step 1 sends "+R.f(t)+", step 2 sends "+R.f(2*t)+", and so on.)",ans:ans,unit:"tokens",tol:0,
  hint:"Add t + 2t + 3t + ... + nt.",sol:"t x (1 + 2 + ... + n) = "+R.f(t)+" x "+(n*(n+1)/2)+" = "+R.f(ans)+" tokens. Cost grows roughly with the square of the number of steps, so step limits and summarising old context matter."};
}},
{id:"m8-pick",type:"pick",title:"Which actions need a human?",
 q:"Tick the agent actions that should require human approval before they run.",
 items:[{t:"Refund of ₹8,000",c:true,w:"High value and hard to reverse."},{t:"Delete a customer record",c:true,w:"Destructive."},{t:"Send a bulk email to all customers",c:true,w:"Wide, public, irreversible."},{t:"Look up an order status",c:false,w:"Read-only and low risk."},{t:"Search help articles",c:false,w:"Read-only."},{t:"Draft a reply for an agent to review",c:false,w:"A draft is itself a review step."}]},
{id:"m8-case",type:"case",title:"Case: design the refund agent",
 q:"Design a refund assistant for a support team. State which parts are code, which are the model, what the agent may do alone, and how you would limit and audit it.",
 model:"Code: eligibility rules, refund limits, order and payment lookups, the refund call itself with an idempotency key, and logging. Model: understanding the customer's message in any language, gathering the right facts through read-only tools, and drafting the reply. The agent may look up orders and policies and draft; it can issue automatic refunds only under a small threshold (for example ₹200) when all rules pass, and everything above requires a support lead's one-click approval. Limits: maximum steps and cost per run, a tool allow-list with least privilege, no delete access, a sandboxed test mode, and a kill switch. Audit: a full trace for every run, sampled review, an eval set of tricky cases including prompt-injection attempts in customer messages, and metrics on refund accuracy, escalation rate and cost.",
 rubric:["Kept eligibility, limits and money movement in deterministic code","Used the model for language and fact-gathering","Set an auto-approve threshold and human approval above it","Added step, cost and tool limits plus a kill switch","Required traces, evals and prompt-injection tests"]}
],
m9:[
{id:"m9-unknown",type:"num",title:"How many payments need reversal?",gen:function(R){
  var N=R.pick([1000000,2500000,5000000]),t=R.pick([0.2,0.4,0.5]),s=R.pick([60,70,80]),ans=Math.round(N*t/100*(1-s/100));
  return {q:"A payment system handles "+R.f(N)+" payments a day. "+t+"% time out with an unknown result. Later status checks show that "+s+"% of those were actually successful. How many of the timed-out payments actually failed and need a reversal or retry?",ans:ans,unit:"payments",tol:0.01,
  hint:"First find the timed-out payments, then take the share that did not succeed.",sol:R.f(N)+" x "+t+"% = "+R.f(N*t/100)+" timed out. "+(100-s)+"% of these failed = "+R.f(ans)+" payments. Without status checks and reconciliation, these become angry customers or lost money."};
}},
{id:"m9-chain",type:"num",title:"Success rate across partners",gen:function(R){
  var o=[99.9,99.5,99.95,99.0,99.8],a=[R.pick(o),R.pick(o),R.pick(o),R.pick(o)],p=a.reduce(function(x,y){return x*y/100},100),ans=R.r(p,2);
  return {q:"An onboarding journey depends on four partners in a row (login OTP, KYC, bureau, e-sign) with success rates of "+a.join("%, ")+"%. What share of journeys complete if each partner fails independently?",ans:ans,unit:"%",abs:0.05,tol:0,
  hint:"Multiply the four success rates.",sol:"Product = "+R.f(ans,2)+"%. With a fallback vendor on the weakest partner, this number rises noticeably."};
}},
{id:"m9-pick",type:"pick",title:"Spot the single points of failure",
 q:"Tick every single point of failure in this lending platform.",
 items:[{t:"One KYC vendor with no fallback",c:true,w:"If it is down, onboarding stops."},{t:"A single queue broker node",c:true,w:"Its failure stops all queued work."},{t:"One engineer who holds the release signing key",c:true,w:"A people dependency counts."},{t:"Three app servers behind a load balancer",c:false,w:"Redundant."},{t:"A primary database with a hot standby",c:false,w:"Failover exists."},{t:"Two payment partners with automatic failover",c:false,w:"Redundant."}]},
{id:"m9-case",type:"case",title:"Case: harden the onboarding flow",
 q:"Your digital lending onboarding completes only 78% of journeys on festival weekends. Partners are slow and sometimes down. Propose changes to the architecture and the product flow.",
 model:"Measure first: drop-off and error rate per step and per partner, with timeouts. Architecture: add timeouts and circuit breakers per partner; add a second vendor or a manual fallback for the weakest steps (KYC, bureau); move non-blocking work (document checks, notifications) to queues; make every partner call idempotent and resumable so a user can continue from where they stopped; cache stable results such as verified identity for a short period within consent rules. Product: show clear progress and a save-and-resume option, explain delays honestly, and send a message when the result is ready. Operations: dashboards per partner, alerts on success rate, partner SLAs, and a rehearsed switch to the backup. Compliance: keep consent and audit records for every step.",
 rubric:["Measured per-step and per-partner failure","Added timeouts, fallbacks or a second vendor","Used queues and resumable, idempotent steps","Improved the user flow (save and resume, honest messaging)","Considered monitoring, SLAs and consent or audit"]}
],
m10:[
{id:"m10-breakeven",type:"num",title:"Build vs buy break-even",gen:function(R){
  var e=R.int(2,5,1),c=R.pick([60000,80000,100000]),inf=R.pick([20000,30000,40000]),I=R.pick([10000,20000,30000]),build=e*c*3+inf*3,ans=Math.round((build-I)/3);
  return {q:"Building in-house needs "+e+" engineers at $"+R.f(c)+" a year each plus $"+R.f(inf)+" a year of infrastructure, over 3 years. Buying needs a one-time integration cost of $"+R.f(I)+" plus an annual licence. At what annual licence fee does buying cost the same as building over 3 years?",ans:ans,unit:"$ per year",tol:0.01,
  hint:"Compute the 3-year build cost, subtract the integration cost, divide by 3.",sol:"Build = "+e+" x $"+R.f(c)+" x 3 + $"+R.f(inf)+" x 3 = $"+R.f(build)+". Buy = $"+R.f(I)+" + 3 x L. Equal when L = ($"+R.f(build)+" - $"+R.f(I)+") / 3 = $"+R.f(ans)+" per year. This ignores speed to market and the value of control, which also matter."};
}},
{id:"m10-debt",type:"num",title:"The interest on a shortcut",gen:function(R){
  var saved=R.pick([10,15,20]),x=R.pick([1,2,3]),r=R.pick([8,12,24]),ppl=R.pick([2,3,4]),ans=x*r*ppl;
  return {q:"Skipping automated tests saved "+saved+" engineer-days. Now each release needs "+x+" extra day(s) of manual checking from each of "+ppl+" people, and there are "+r+" releases a year. How many extra engineer-days does this cost per year?",ans:ans,unit:"engineer-days per year",tol:0,
  hint:"Multiply extra days, people and releases.",sol:x+" x "+ppl+" x "+r+" = "+ans+" engineer-days a year, against "+saved+" saved once. The shortcut pays back its cost after "+R.f(saved/(x*ppl),1)+" releases and then keeps costing."};
}},
{id:"m10-pick",type:"pick",title:"Which questions expose risk?",
 q:"Tick the questions that are specific enough to expose real risk in a design review.",
 items:[{t:"What would make you change this decision?",c:true,w:"Surfaces assumptions and triggers."},{t:"What is the worst failure and how would we know?",c:true,w:"Focuses on impact and detection."},{t:"What does it cost per user at 10x?",c:true,w:"Quantified and testable."},{t:"Can you make it more scalable?",c:false,w:"Vague; ask for a number and a bottleneck."},{t:"Is it secure?",c:false,w:"Too broad. Ask who can see what and how it is checked."},{t:"Why didn't you use the newest framework?",c:false,w:"Fashion, not risk."}]},
{id:"m10-case",type:"case",title:"Case: review an inherited design",
 q:"You join a team mid-project and receive a design for a new KYC and loan-approval service. You have one hour with the tech lead. List your first questions and the artifacts you would ask to see.",
 model:"Artifacts: an architecture diagram with all external dependencies, ADRs for key choices, the SLOs and current dashboards, the threat model and data classification, the load test results, rollback and runbook documents, and the cost estimate. Questions: what are the expected load and the 10x case; what is the single point of failure; what happens when a partner is down for an hour; where is the source of truth for each data type; how are retries made safe; who can see what data and how is it enforced; how do we explain an approval or rejection to a customer or regulator; how long does rollback take; how will model or rule changes be tested and monitored; what is the cost per application; and what debt are we knowingly taking, with an owner and date. I would then turn gaps into actions in the PRD and record agreed decisions as ADRs.",
 rubric:["Asked for the diagram, SLOs, threat model and rollback artifacts","Asked about load, single points of failure and partner outages","Asked about data ownership, access control and explainability","Asked about cost and knowing debt","Planned to record decisions and follow-up actions"]}
]
};

<script>
window.XDEEP=window.XDEEP||{};
window.XDEEP.m0=[
{t:'What happens when a user taps "Pay"',
 p:['Every product feature is a chain of small hops. Knowing the hops lets you ask "which hop is slow, broken or expensive?" instead of "why is the app bad?".'],
 list:['1. The app (front end) collects input and checks the obvious errors locally, such as an empty amount.',
  '2. The app sends an HTTPS request to your domain. The domain name is turned into an IP address by DNS (Domain Name System).',
  '3. A CDN or load balancer receives it first. It may serve a cached copy or pass the request to one of many identical servers.',
  '4. An API gateway checks who is calling (authentication), whether they are allowed (authorization) and whether they are sending too many requests (rate limit).',
  '5. The service (back end) runs the business rules: balance, limits, fraud checks. It reads and writes the database inside one transaction.',
  '6. Slow or non-urgent work goes onto a queue: send the SMS, update the ledger report, tell the analytics system.',
  '7. The response travels back the same way. The app shows success, failure or "pending".',
  '8. Logs, metrics and traces are written at every hop so the team can see what happened later.'],
 so:'Each hop has its own owner, its own failure mode and its own latency. When someone says "payments are slow", the first PM question is: slow at which hop, for which users, since when?'},
{t:'Latency numbers worth remembering',
 p:['These are rough, rounded values (they vary by hardware and network) but the ratios are what matter. They explain why engineers cache, batch and keep data close to users.'],
 table:{head:['Operation','Rough time','What it means for product'],rows:[
  ['Read from memory (RAM)','about 100 nanoseconds','Cached data is almost free to read.'],
  ['Read from a local SSD','about 100 microseconds','Fast, but 1,000 times slower than RAM.'],
  ['Round trip inside one data centre','about 0.5 milliseconds','Calling 20 services in a chain adds up fast.'],
  ['Round trip across a continent (for example Mumbai to Frankfurt)','about 120 to 150 milliseconds','Where your servers sit decides how fast the app feels in India.'],
  ['Mobile network (4G) round trip','about 50 to 100 milliseconds, with big swings','Real users are slower than your office Wi-Fi tests.'],
  ['A database query with a missing index on a big table','hundreds of milliseconds to seconds','Most "the screen is slow" bugs are this.']]},
 so:'A screen that makes 6 sequential calls of 150 ms each is already near a second before any work is done. Ask for calls in parallel, one combined call, or cached data.'},
{t:'Scaling: up, out, and the limits',
 p:['Vertical scaling means a bigger machine. Horizontal scaling means more machines behind a load balancer. Vertical is simple but has a ceiling and a single point of failure. Horizontal needs the app to be stateless (any server can handle any request), which pushes state into the database or cache.'],
 table:{head:['Approach','Good for','Watch out for'],rows:[
  ['Scale up (bigger server)','Quick fix, databases, early stage','Ceiling, downtime when resizing, one machine is still one failure.'],
  ['Scale out (more servers)','Web and API servers, traffic spikes','Needs stateless design, shared sessions, more moving parts.'],
  ['Cache in front','Read-heavy data that changes rarely','Stale data and cache invalidation bugs.'],
  ['Queue in front','Spikes that can wait seconds','Users must accept "we are processing it".'],
  ['Shard the database','Very large data or write volume','Complex queries, hard to undo. Last resort.']]},
 so:'Before approving "we need to scale", ask for the number: requests per second now, at peak, and the target. Often the answer is an index or a cache, not new architecture.'}
];

window.XDEEP.m1=[
{t:'From typing a URL to a visible page',
 p:['This sequence is why page speed is a product decision and not just an engineering detail.'],
 table:{head:['Step','What happens','Typical cost','Product lever'],rows:[
  ['DNS lookup','The browser finds the server address for the domain','20 to 120 ms','Use a fast DNS provider; fewer third party domains.'],
  ['TCP and TLS handshake','Connection set up, encryption agreed','1 to 3 round trips','HTTP/2 and HTTP/3, keep-alive, CDN close to users.'],
  ['Request and first byte (TTFB)','Server builds and starts sending the response','50 to 800 ms','Caching, faster back end, static pages.'],
  ['Download and parse HTML, CSS, JavaScript','Browser reads files and builds the page structure','Depends on size','Smaller bundles, load only what the screen needs.'],
  ['Render and paint','Browser draws pixels','Tens of ms','Avoid layout shifts, big images, heavy scripts.'],
  ['Hydration (for server rendered React style apps)','JavaScript attaches to the HTML so it becomes interactive','Can be 100s of ms on cheap phones','Ship less JavaScript; render static parts only.']]},
 so:'Test on a mid range Android phone on 4G, not on a developer laptop. Many Indian users are on exactly that device.'},
{t:'Core Web Vitals: the three numbers to put in a PRD',
 p:['Google publishes thresholds for "good" experience, measured at the 75th percentile of real users. They also influence search ranking.'],
 table:{head:['Metric','Full form','Measures','Good threshold'],rows:[
  ['LCP','Largest Contentful Paint','How fast the main content appears','2.5 seconds or less'],
  ['INP','Interaction to Next Paint','How quickly the page reacts to taps and clicks','200 milliseconds or less'],
  ['CLS','Cumulative Layout Shift','How much things jump around while loading','0.1 or less']]},
 so:'Write a requirement as "LCP under 2.5 s at p75 on a mid range phone on 4G for the checkout screen", not "make it fast".'},
{t:'Where the browser keeps data',
 table:{head:['Place','Lives for','Sent to server automatically?','Size','Use for','Do not use for'],rows:[
  ['Cookie','Until expiry; can be session only','Yes, with every request to that domain','About 4 KB','Login session id (marked HttpOnly and Secure)','Large data, anything readable by scripts that is secret'],
  ['localStorage','Until cleared by user or app','No','About 5 MB','UI preferences, drafts','Tokens or personal data (any script on the page can read it)'],
  ['sessionStorage','Until the tab closes','No','About 5 MB','Temporary wizard state','Anything needed after the tab closes'],
  ['IndexedDB','Until cleared','No','Large (hundreds of MB)','Offline data, large caches','Simple flags'],
  ['HTTP cache and CDN cache','Controlled by Cache-Control headers','n/a','Large','Images, scripts, public API responses','User specific private data on a shared cache']]},
 so:'"Why was I logged out?" and "why do I still see old data?" are almost always cookie expiry or cache rules. Both are product decisions: session length is a trade-off between convenience and risk.'},
{t:'Shipping apps: web, store and forced updates',
 p:['A web release reaches everyone within minutes. A mobile release goes through store review (hours to days), and users update at their own pace, so old versions stay alive for months. That is why the back end must support old app versions and why feature flags matter.'],
 list:['Feature flag: code ships switched off and is turned on for 1 percent, then 10 percent, then everyone, without a new release.',
  'Force update: the API tells very old app versions to update. Needed after a security fix or a breaking API change.',
  'Staged rollout: stores let you release to a percentage of users and halt if crash rate rises.',
  'Remote config: values such as limits, copy and thresholds are changed from a server, not by a release.'],
 so:'For regulated flows such as KYC or payments, plan a minimum supported app version and an emergency force update path before launch.'}
];

window.XDEEP.m2=[
{t:'Anatomy of an HTTP request and response',
 p:['HTTP (HyperText Transfer Protocol) is the language apps and servers speak. A request has four parts: a method (what to do), a URL (which thing), headers (extra information) and an optional body (the data). A response has a status code (how it went), headers and an optional body.'],
 code:{label:'Example: create a payment (request, then response)',text:'POST /v1/payments HTTP/1.1\nHost: api.examplebank.in\nAuthorization: Bearer eyJhbGciOi...\nContent-Type: application/json\nIdempotency-Key: 7f3c9e1a-52b4-4d0a-9c1e\n\n{\n  "from_account": "ACC123",\n  "to_account": "ACC987",\n  "amount": 2500.00,\n  "currency": "INR"\n}\n\nHTTP/1.1 201 Created\nContent-Type: application/json\nLocation: /v1/payments/pay_8841\n\n{\n  "id": "pay_8841",\n  "status": "processing",\n  "amount": 2500.00\n}'},
 so:'Read any API doc by finding these four things: method, URL, what goes in the headers and body, and which status codes come back. That is 90 percent of understanding an integration.'},
{t:'HTTP methods: GET, POST, PUT, PATCH, DELETE and friends',
 p:['"Safe" means it does not change anything on the server. "Idempotent" means doing it once or ten times leaves the same result. Idempotency decides whether a request can be retried blindly.'],
 table:{head:['Method','Meaning','Safe?','Idempotent?','Has body?','Bank style example'],rows:[
  ['GET','Read a resource','Yes','Yes','No','GET /v1/accounts/ACC123/balance'],
  ['POST','Create something or trigger an action','No','No (unless you add an idempotency key)','Yes','POST /v1/payments sends money. Twice means two payments.'],
  ['PUT','Replace a whole resource','No','Yes','Yes','PUT /v1/customers/42 with the full profile'],
  ['PATCH','Change part of a resource','No','Usually not guaranteed','Yes','PATCH /v1/customers/42 with only {"phone": "..."}'],
  ['DELETE','Remove a resource','No','Yes (second call finds nothing)','Rare','DELETE /v1/beneficiaries/9'],
  ['HEAD','Like GET but returns headers only','Yes','Yes','No','Check if a statement file exists and its size'],
  ['OPTIONS','Ask what is allowed (used by browsers for CORS checks)','Yes','Yes','No','Automatic by the browser before cross-site calls']]},
 so:'The dangerous one is POST. If a payment POST times out, the app does not know if it worked. Without an idempotency key a retry can charge twice. This single fact drives a lot of fintech design.'},
{t:'Status codes: what the number tells you',
 p:['The first digit is the family: 2xx success, 3xx redirect, 4xx the caller made a mistake, 5xx the server has a problem. This is how support, monitoring and the app decide what to do next.'],
 table:{head:['Code','Name','Meaning','What the product should do'],rows:[
  ['200','OK','Worked, here is the data','Show it'],
  ['201','Created','A new thing was made','Show confirmation, store the new id'],
  ['202','Accepted','Received, will be processed later','Show "pending" and poll or wait for a callback'],
  ['204','No Content','Worked, nothing to return','Update the screen'],
  ['301 or 302','Redirect','Resource moved','Follow it (browsers do automatically)'],
  ['304','Not Modified','Your cached copy is still valid','Use the cache, save bandwidth'],
  ['400','Bad Request','The request is malformed','Fix the input; show field level errors'],
  ['401','Unauthorized','Not logged in or token expired','Refresh the token or send to login'],
  ['403','Forbidden','Logged in but not allowed','Show "you do not have access"; never retry'],
  ['404','Not Found','No such resource','Show a clear empty or error state'],
  ['409','Conflict','Clashes with current state, for example duplicate or edited by someone else','Ask the user to reload or resolve'],
  ['422','Unprocessable Entity','Well formed but fails business rules','Show the rule that failed, such as limit exceeded'],
  ['429','Too Many Requests','Rate limit hit','Wait for Retry-After, then retry with backoff'],
  ['500','Internal Server Error','Unexpected bug on the server','Show a generic error; alert the team'],
  ['502 or 504','Bad Gateway or Gateway Timeout','A service behind the gateway failed or was too slow','Retry carefully; the action may or may not have happened'],
  ['503','Service Unavailable','Overloaded or in maintenance','Show maintenance state; retry later']]},
 so:'Ask your team to list the exact error cases for each API call and the user message for each. A spec that only covers 200 is a spec for a perfect world.'},
{t:'Headers that matter to a PM',
 table:{head:['Header','Purpose','Example value','Why you should care'],rows:[
  ['Authorization','Proves who is calling','Bearer eyJhbGciOi...','Missing or expired gives 401'],
  ['Content-Type','Format of the body being sent','application/json','Wrong type gives 400 or 415'],
  ['Accept','Format the caller wants back','application/json','Lets one URL serve several formats'],
  ['Idempotency-Key','Makes a POST safe to retry','A unique id the client generates','Prevents duplicate payments and orders'],
  ['Cache-Control','How long a response may be cached','max-age=300','Controls freshness versus speed'],
  ['ETag and If-None-Match','Version tag so unchanged data is not re-sent','"v17"','Saves data on slow networks'],
  ['Retry-After','How long to wait after 429 or 503','30','Respecting it avoids making an outage worse'],
  ['X-Request-ID or traceparent','Id that follows one request across services','req-93f1','Support can find the exact request from a user complaint'],
  ['User-Agent','Which app or client is calling','MyApp/4.2 Android 14','Lets you see which versions cause errors']]},
 so:'Always include a request id in error screens and support tools. "Error code req-93f1" gets a bug fixed in minutes; "it did not work" takes days.'},
{t:'Authentication for APIs: who is calling?',
 table:{head:['Method','How it works','Best for','Risks and notes'],rows:[
  ['API key','A long secret string sent in a header','Server to server, simple partner access','If leaked, anyone can use it. Rotate often. Never put in mobile apps or web pages.'],
  ['Basic auth','Username and password encoded in a header','Legacy and internal tools','Sends the password every time. Avoid for new work.'],
  ['Bearer token (JWT, JSON Web Token)','Short lived signed token issued after login','Mobile and web apps','Cannot be easily revoked before expiry, so keep it short (minutes) and use refresh tokens.'],
  ['OAuth 2.0','Standard flow where a user lets one app act on another without sharing the password','"Sign in with Google", account aggregators, open banking','Complex: scopes, consent screens, refresh tokens.'],
  ['mTLS (mutual TLS)','Both sides present certificates','Bank to bank and regulated integrations','Certificate expiry is a classic outage. Track renewal dates.'],
  ['HMAC signature','Request body is signed with a shared secret','Webhooks from payment gateways','Receiver must verify the signature and reject old timestamps.']]},
 so:'Authentication answers "who are you?". Authorization answers "what may you do?". Mixing them up is how data leaks happen (see the Security module).'},
{t:'Pagination, filtering, versioning and rate limits',
 p:['Any list endpoint (transactions, orders) must not return everything at once. These four design choices show up in almost every API you will specify.'],
 table:{head:['Topic','Options','Trade-off'],rows:[
  ['Pagination','Offset: ?page=3&limit=20. Cursor: ?after=txn_8841&limit=20','Offset is simple but slow on big tables and shows duplicates if data changes. Cursor is stable and fast but you cannot jump to page 50.'],
  ['Filtering and sorting','?status=failed&from=2026-10-01&sort=-created_at','Every filter needs an index; unlimited filters can slow the database.'],
  ['Versioning','In the path (/v2/payments), in a header, or by date','Path versions are easiest to understand. Old versions must be supported for a promised period.'],
  ['Rate limits','For example 100 requests per minute per key, with bursts','Protects the system and other customers. Decide what happens at the limit: reject with 429, queue, or slow down.'],
  ['Breaking vs non-breaking change','Adding an optional field is safe. Removing or renaming a field, or changing meaning, breaks callers','Breaking changes need a new version, notice, and a migration plan.']]},
 so:'For a public or partner API, a deprecation policy ("we support a version for 12 months after announcing its end") is a product promise. Put it in writing.'},
{t:'REST, GraphQL, gRPC, webhooks and WebSockets in practice',
 code:{label:'The same need (get a customer and their last 3 orders) in each style',text:'REST (several calls, simple, cacheable)\n  GET /customers/42\n  GET /customers/42/orders?limit=3\n\nGraphQL (one call, caller chooses fields)\n  POST /graphql\n  { customer(id: 42) { name  orders(last: 3) { id total } } }\n\ngRPC (binary, fast, typed contract, mostly service to service)\n  rpc GetCustomerWithOrders(CustomerRequest) returns (CustomerReply)\n\nWebhook (the other side calls you when something happens)\n  POST https://yourapp.in/hooks/payment   <- sent by the gateway\n  { "event": "payment.captured", "id": "pay_8841" }\n\nWebSocket (one long open connection, both sides can send any time)\n  server pushes: { "type": "price_update", "symbol": "GOLD", "price": 6120 }'},
 table:{head:['Style','Use when','Avoid when'],rows:[
  ['REST (Representational State Transfer)','Public and partner APIs, simple CRUD, you want easy caching and tooling','Screens need data from many resources in one go, causing many calls'],
  ['GraphQL','Many different clients (web, iOS, Android) need different slices of data','Simple needs, or you need strict cost control per call'],
  ['gRPC (Google Remote Procedure Call)','Internal microservices needing speed and strict contracts','Browsers and external partners (poor native support)'],
  ['Webhook','The other system should tell you about events, such as payment success','You need data immediately and cannot tolerate missed or duplicate events without handling them'],
  ['WebSocket','Live data: chat, trading prices, delivery tracking','Rare updates; polling or push notifications are cheaper']]},
 so:'Webhooks can arrive late, twice or out of order. Always ask: do we verify the signature, handle duplicates, and have a way to re-fetch the truth if one is missed?'},
{t:'Delivery guarantees: at most once, at least once, exactly once',
 table:{head:['Guarantee','Meaning','Risk','Example'],rows:[
  ['At most once','Sent once, maybe lost','Lost messages','Analytics ping where a loss is fine'],
  ['At least once','Retried until acknowledged, maybe duplicated','Duplicates','Most queues and webhooks. Consumer must be idempotent.'],
  ['Exactly once (effective)','Duplicates are detected and ignored','Hard and costly; usually built from at least once plus idempotency','Payment ledger entries keyed by a unique transaction id']]},
 so:'"Exactly once" is almost always at-least-once delivery plus a de-duplication key. Ask where the key is stored and for how long.'}
];

window.XDEEP.m3=[
{t:'SQL in one screen, using a money transfer',
 p:['SQL (Structured Query Language) is how you read and change data in relational databases. A PM does not need to write it fluently, but should read it. The key idea is the transaction: either all steps happen or none do.'],
 code:{label:'Transfer 2,500 from account A to B, safely',text:'BEGIN;\n\nUPDATE accounts SET balance = balance - 2500\n WHERE id = \'A\' AND balance >= 2500;\n\nUPDATE accounts SET balance = balance + 2500\n WHERE id = \'B\';\n\nINSERT INTO ledger (txn_id, from_acc, to_acc, amount)\n VALUES (\'txn_8841\', \'A\', \'B\', 2500);\n\nCOMMIT;   -- if anything failed above: ROLLBACK;\n\n-- Reading: last 10 failed payments for one customer\nSELECT id, amount, created_at\n  FROM payments\n WHERE customer_id = 42 AND status = \'failed\'\n ORDER BY created_at DESC\n LIMIT 10;'},
 so:'If a feature moves money or stock, ask "is this one transaction?". If the answer is "we call two services", the design needs a saga or reconciliation plan (see below).'},
{t:'ACID and why banks pick relational databases',
 table:{head:['Letter','Property','Plain meaning','Failure if missing'],rows:[
  ['A','Atomicity','All steps of a transaction happen or none','Money leaves A but never reaches B'],
  ['C','Consistency','Rules (constraints) always hold after a transaction','Negative balances, orphan records'],
  ['I','Isolation','Simultaneous transactions do not see each other half done','Two people buy the last seat'],
  ['D','Durability','Once committed, it survives a crash','A confirmed payment vanishes after a restart']]},
 so:'Isolation levels (read committed, repeatable read, serializable) trade correctness for speed. For money and inventory ask which level is used and how double spending is prevented.'},
{t:'Relational, document, key-value, graph, search and vector databases',
 table:{head:['Type','Shape of data','Examples','Strength','Weakness','Typical use'],rows:[
  ['Relational (SQL)','Tables with rows, columns and relations','PostgreSQL, MySQL, Oracle','Transactions, joins, strict rules','Harder to scale writes across machines','Accounts, orders, ledgers'],
  ['Document','JSON-like documents','MongoDB, DynamoDB','Flexible shape, easy scale out','Joins and multi record transactions are weaker','Catalogues, profiles'],
  ['Key-value','Key points to a value','Redis, DynamoDB','Extremely fast reads','No rich queries','Sessions, caches, rate limit counters'],
  ['Wide column','Rows with flexible columns, partitioned','Cassandra, Bigtable','Huge write volume','Query patterns must be planned upfront','Event and time series data'],
  ['Graph','Nodes and relationships','Neo4j','Relationship queries','Niche skills','Fraud rings, recommendations'],
  ['Search engine','Inverted index over text','Elasticsearch, OpenSearch','Full text search, filters','Not the source of truth','Product search, log search'],
  ['Vector','Numbers that represent meaning','pgvector, Pinecone','Similarity search for AI','Approximate answers','RAG and semantic search']]},
 so:'Default to a relational database unless there is a measured reason not to. "We might need scale" is not a measured reason.'},
{t:'Indexes, the N+1 problem and why a screen gets slow',
 list:['Index: a sorted lookup structure, like the index of a book. It makes reads fast and writes a little slower. A query on an unindexed column on a large table scans every row.',
  'N+1 problem: the code loads 1 list of 50 orders, then makes 50 more queries, one per order, for the customer name. 51 queries instead of 1 or 2. It looks fine with 10 test rows and collapses with 100,000.',
  'Connection pool: a database allows only a limited number of simultaneous connections. A traffic spike can exhaust them and every request starts failing.',
  'Hot row or lock contention: many requests updating the same row (a popular product, a global counter) queue behind each other.'],
 so:'When a screen is slow, ask for the slowest queries and their counts per request. "How many database calls does this screen make?" is a great PM question.'},
{t:'CAP theorem, replication and sharding',
 p:['CAP says that when the network between data copies breaks (a partition), a system must choose between Consistency (everyone sees the same latest data) and Availability (it keeps answering). You cannot have both during the break.'],
 table:{head:['Idea','What it is','Product impact'],rows:[
  ['Replication','Copies of the data on several machines','Read replicas make reads fast, but a replica can lag by seconds, so you may read old data right after a write.'],
  ['Primary and replica','One machine accepts writes; others copy it','If the primary fails, failover takes seconds to minutes.'],
  ['Eventual consistency','Copies agree after a short delay','Fine for likes and feeds, not for balances.'],
  ['Strong consistency','Reads always see the latest write','Needed for money, stock, bookings; costs speed.'],
  ['Sharding','Splitting data across machines by a key such as customer id','Scales writes, but cross shard queries and reports get hard.'],
  ['Backup versus replica','A replica copies mistakes instantly; a backup is a point in time copy','A bad delete runs on all replicas. Only backups bring data back.']]},
 so:'The GitLab 2017 case in this module shows why: replicas and backups are not the same, and a backup that was never test restored is a hope, not a backup.'},
{t:'Keeping data in step across services: saga, outbox, reconciliation',
 p:['In microservices there is no single transaction across services. Three patterns replace it.'],
 table:{head:['Pattern','How it works','Example'],rows:[
  ['Saga','A chain of local steps, each with a compensating step to undo it if a later step fails','Reserve stock, charge card, create shipment. If shipping fails, refund and release stock.'],
  ['Outbox','Write the business change and the "event to send" in the same database transaction; a separate process publishes the event','Order saved and "OrderPlaced" event never gets lost even if the queue is down.'],
  ['Reconciliation','A scheduled job compares two systems and flags mismatches','Daily match of your ledger against the bank settlement file.']]},
 so:'In payments, reconciliation is not optional. Ask what the mismatch rate is, who reviews breaks, and how long an unresolved break can stay open.'},
{t:'Caching strategies and their traps',
 table:{head:['Strategy','How','Good for','Trap'],rows:[
  ['Cache-aside','App checks cache, on a miss reads the database and fills the cache','Most read-heavy data','First request after expiry is slow; stale data until expiry'],
  ['Write-through','Every write goes to the cache and database together','Data read right after it is written','Slower writes'],
  ['Write-back','Write to the cache and save to the database later','Very high write rates','Data loss if the cache fails before saving'],
  ['TTL (time to live)','Entries expire after a set time','Simple freshness control','Too long gives stale data, too short gives no benefit'],
  ['Invalidate on change','Delete the cached entry when the data changes','Data that must be fresh','Easy to miss a code path, causing stale data bugs']]},
 so:'"There are only two hard things in computer science: cache invalidation and naming things." Ask what the staleness limit is for each cached item, in seconds, and who agreed to it.'}
];
